name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.1'
          cache: true

      - name: Generate Android platform
        run: |
          cd ..
          flutter create --platforms=android --org com.xingkong --project-name xingkong_ledger /tmp/xk_flutter_android
          rm -rf flutter_app/android
          cp -R /tmp/xk_flutter_android/android flutter_app/android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xk-release.jks"
          ls -lh "$RUNNER_TEMP/xk-release.jks"

      - name: Patch Android label/icon/signing
        run: python3 tool/patch_android.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          XK_KEYSTORE_PATH: ${{ runner.temp }}/xk-release.jks
          XK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          XK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          XK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Prepare asset
        run: |
          mkdir -p ../dist_flutter
          cp build/app/outputs/flutter-apk/app-release.apk "../dist_flutter/星空记账-flutter-v0.9.1.apk"
          ls -lh ../dist_flutter

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingkong-flutter-v0.9.1
          path: dist_flutter/星空记账-flutter-v0.9.1.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-v0.9.1
          name: 星空记账 Flutter v0.9.1（统计布局修正）
          body: |
            纯 Flutter 原生重写：转账、分类预算、完整 Excel、报表图片/PDF 与资产区间。
            - 修复部分 WPS/Excel 文件导入时报 numFmtId 0 错误
            - 兼容旧版导出中支出金额为负数的 Excel，并保留原始时间
            - Excel 重复导入自动去重
            - 顶部/底部液态模糊
            - 明细星空椭圆月度卡片，年月独立上下滑动
            - 明细固定顶栏、统计固定顶栏
            - 界面切换 380ms 缓动与明细懒加载
            - 星空/方形卡片样式切换
            - 滑动显示删除按钮
            - 日历农历、节假日、滑动换月与年月选择
            - 统计新增周统计、自定义统计、排行/报表/总结
            - 日历农历与节假日
            - 图表金额标签与柱/线切换
            - 统计总结增强
            - 顶栏随滑动/切换下滑
            - 资产图标按钮一排
            - 明细 / 记账 / 日历 / 月统计 / 资产 / 我的
            - 分类管理、月预算、账户余额、分类统计
            - 年统计：12 个月柱状图、近十年收支、所有年份汇总
            - 月/年热力图：紧凑 12 月网格与全屏 5×7 日热力图
            - 13 套主题，含 9 个场景主题
            - 从相册导入自定义背景图片，自动压缩并保存在本机
            - JSON / Excel 导入导出（23 列标准账单格式）
            - 周期记账（每天 / 每周 / 每月）
            - 隐私锁
            - 资产走势、收支对比、支出排行、完整报表
            - 账户间转账
            - 分类预算
            - Excel 23 列完整字段映射
            - 年度报表导出图片 / PDF
            - 资产走势 30 天 / 12 月 / 全部区间
            - 使用固定发布签名，后续版本可直接覆盖升级
            - 与原 WebView 版为不同包名，可并存安装
            后续阶段迁移：更完整的 Excel 字段映射、资产转移、分类预算与高级统计。
          files: dist_flutter/星空记账-flutter-v0.9.1.apk
          draft: false
          prerelease: true
          allowUpdates: true
