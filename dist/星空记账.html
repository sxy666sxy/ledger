    s.calendarLunar = s.calendarLunar !== false;

    if (!Array.isArray(data.tags)) data.tags = [];
    data.tags = Array.from(new Set(data.tags.filter((t) => typeof t === 'string')));
    return data;
  }

  function validateBackup(obj) {
    if (!obj || typeof obj !== 'object') return { ok: false, error: '文件内容不是有效的数据' };
    const data = obj.data && typeof obj.data === 'object' ? obj.data : obj;
    if (!Array.isArray(data.books) || !Array.isArray(data.transactions)) {
      return { ok: false, error: '缺少账本或账单数据，无法导入' };
    }
    const migrated = migrateData(JSON.parse(JSON.stringify(data)));
    if (!migrated) return { ok: false, error: '数据格式无法识别' };
    return { ok: true, data: migrated };
  }

  /* ------------------------------------------------------------------ *
   * 查询 / 统计
   * ------------------------------------------------------------------ */

  function categoryMap(data) {
    const map = {};
    data.categories.forEach((c) => { map[c.id] = c; });
    return map;
  }
  function accountMap(data) {
    const map = {};
    data.accounts.forEach((a) => {
      map[a.id] = a; });
    return map;
  }
  function activeBook(data) {
    return data.books.find((b) => b.id === data.activeBookId) || data.books[0];
  }
  function categoriesOf(data, type) {
    return data.categories
      .filter((c) => c.type === type)
      .sort((a, b) => (a.order || 0) - (b.order || 0));
  }

  function sortTransactions(list) {
    return list.slice().sort((a, b) => {
      const ta = a.date + ' ' + a.time;
      const tb = b.date + ' ' + b.time;
      if (ta !== tb) return tb.localeCompare(ta);
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    });
  }

  function bookTransactions(data, bookId) {
    const id = bookId || data.activeBookId;
    return sortTransactions(data.transactions.filter((t) => t.bookId === id));
  }

  function filterTransactions(data, opts) {
    const o = opts || {};
    const cm = categoryMap(data);
    const am = accountMap(data);
    const q = String(o.q || '').trim().toLowerCase();
    let list = data.transactions.filter((t) => {
      if (o.bookId && t.bookId !== o.bookId) return false;
      if (o.type && t.type !== o.type) return false;
      if (o.categoryId && t.categoryId !== o.categoryId) return false;
      if (o.accountId && t.accountId !== o.accountId && t.toAccountId !== o.accountId) return false;
      if (o.month && monthKeyOf(t.date) !== o.month) return false;
      if (o.from && t.date < o.from) return false;
      if (o.to && t.date > o.to) return false;
      if (o.tag && !(t.tags || []).includes(o.tag)) return false;
      if (q) {
        const cat = cm[t.categoryId];
        const acc = am[t.accountId];
        const to = am[t.toAccountId];
        const hay = [
          t.note, t.tags && t.tags.join(' '), cat && cat.name, acc && acc.name,
          to && to.name, money(t.amount, 2), String(t.amount), TYPE_CN[t.type],
          dateLabel(t.date), t.date, t.subcategory, t.reimburseAccount, t.reimburseNote,
          t.currency, t.location, t.creator, t.extra, t.reimburseAmount
        ].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    return sortTransactions(list);
  }

  function monthTotals(data, bookId, monthKey) {
    let expense = 0, income = 0, count = 0, transfer = 0;
    for (const t of data.transactions) {
      if (t.bookId !== bookId || monthKeyOf(t.date) !== monthKey) continue;
      if (!t.amount) continue;
      count++;
      if (t.type === 'expense') expense += toCents(t.amount);
      else if (t.type === 'income') income += toCents(t.amount);
      else transfer += toCents(t.amount);
    }
    return {
      expense: fromCents(expense),
      income: fromCents(income),
      balance: fromCents(income - expense),
      transfer: fromCents(transfer),
      count
    };
  }

  function dayTotals(data, bookId, monthKey) {
    const map = {};
    for (const t of data.transactions) {
      if (t.bookId !== bookId || monthKeyOf(t.date) !== monthKey) continue;
      const d = Number(t.date.slice(8, 10));
      if (!map[d]) map[d] = { expense: 0, income: 0, count: 0 };
      map[d].count++;
      if (t.type === 'expense') map[d].expense += toCents(t.amount);
      if (t.type === 'income') map[d].income += toCents(t.amount);
    }
    Object.keys(map).forEach((k) => {
      map[k].expense = fromCents(map[k].expense);
      map[k].income = fromCents(map[k].income);
    });
    return map;
  }

  function categoryBreakdown(data, bookId, monthKey, type) {
    const cm = categoryMap(data);
    const totals = {};
    let sum = 0;
    for (const t of data.transactions) {
      if (t.bookId !== bookId || monthKeyOf(t.date) !== monthKey) continue;
      if (t.type !== type) continue;
      const key = t.categoryId || 'unknown';
      const cents = toCents(t.amount);
      sum += cents;
      if (!totals[key]) totals[key] = { cents: 0, count: 0 };
      totals[key].cents += cents;
      totals[key].count++;
    }
    const list = Object.keys(totals).map((key) => {
      const c = cm[key] || { id: key, name: '未分类', icon: '🏷️', color: '#94a3b8' };
      return {
        id: key,
        name: c.name,
        icon: c.icon,
        color: c.color,
        value: fromCents(totals[key].cents),
        count: totals[key].count,
        pct: sum ? totals[key].cents / sum : 0
      };
    });
    list.sort((a, b) => b.value - a.value);
    return list;
  }

  function accountBalances(data, bookId) {
    const map = {};
    data.accounts.forEach((a) => {
      map[a.id] = toCents(a.initial); });
    for (const t of data.transactions) {
      if (bookId && t.bookId !== bookId) continue;
      if (t.type === 'income' && map[t.accountId] != null) map[t.accountId] += toCents(t.amount);
      if (t.type === 'expense' && map[t.accountId] != null) map[t.accountId] -= toCents(t.amount);
      if (t.type === 'transfer') {
        if (map[t.accountId] != null) map[t.accountId] -= toCents(t.amount);
        if (t.toAccountId && map[t.toAccountId] != null) map[t.toAccountId] += toCents(t.amount);
      }
    }
    Object.keys(map).forEach((k) => { map[k] = fromCents(map[k]); });
    return map;
  }

  function totalAssets(data) {
    const balances = accountBalances(data);
    let assets = 0, debts = 0;
    data.accounts.forEach((a) => {
      if (!a.include) return;
      const amt = toCents(balances[a.id] || 0);
      if (ACCOUNT_TYPES[a.type] && ACCOUNT_TYPES[a.type].liability) {
        if (amt < 0) debts += amt;
        else assets += amt;
      } else {
        assets += amt;
      }
    });
    return {
      assets: fromCents(assets),
      debts: fromCents(debts),
      net: fromCents(assets + debts)
    };
  }

  function accountMonthFlow(data, accountId, monthKey) {
    let inflow = 0, outflow = 0;
    for (const t of data.transactions) {
      if (monthKeyOf(t.date) !== monthKey) continue;
      if (t.type === 'income' && t.accountId === accountId) inflow += toCents(t.amount);
      if (t.type === 'expense' && t.accountId === accountId) outflow += toCents(t.amount);
      if (t.type === 'transfer') {
        if (t.accountId === accountId) outflow += toCents(t.amount);
        if (t.toAccountId === accountId) inflow += toCents(t.amount);
      }
    }
    return { inflow: fromCents(inflow), outflow: fromCents(outflow) };
  }

  function inDateRange(date, from, to) {
    return (!from || date >= from) && (!to || date <= to);
  }

  function rangeTotals(data, bookId, from, to) {
    let expense = 0, income = 0, transfer = 0, count = 0;
    data.transactions.forEach((t) => {
      if (bookId && t.bookId !== bookId) return;
      if (!inDateRange(t.date, from, to)) return;
      count++;
      if (t.type === 'expense') expense += toCents(t.amount);
      else if (t.type === 'income') income += toCents(t.amount);
      else transfer += toCents(t.amount);
    });
    return {
      expense: fromCents(expense),
      income: fromCents(income),
      balance: fromCents(income - expense),
      transfer: fromCents(transfer),
      count
    };
  }

  function categoryBreakdownRange(data, bookId, from, to, type) {
    const cm = categoryMap(data);
    const totals = {};
    let sum = 0;
    data.transactions.forEach((t) => {
      if (bookId && t.bookId !== bookId) return;
      if (t.type !== type || !inDateRange(t.date, from, to)) return;
      const key = t.categoryId || 'unknown';
      const cents = toCents(t.amount);
      sum += cents;
      if (!totals[key]) totals[key] = { cents: 0, count: 0 };
      totals[key].cents += cents;
      totals[key].count++;
    });
    const list = Object.keys(totals).map((key) => {
      const c = cm[key] || { id: key, name: '未分类', icon: '🏷️', color: '#94a3b8' };
      return {
        id: key, name: c.name, icon: c.icon, color: c.color,
        value: fromCents(totals[key].cents), count: totals[key].count,
        pct: sum ? totals[key].cents / sum : 0
      };
    });
    list.sort((a, b) => b.value - a.value);
    return list;
  }

  function dailyRows(data, bookId, from, to) {
    const map = {};
    data.transactions.forEach((t) => {
      if (bookId && t.bookId !== bookId) return;
      if (!inDateRange(t.date, from, to)) return;
      if (!map[t.date]) map[t.date] = { date: t.date, expense: 0, income: 0, count: 0 };
      map[t.date].count++;
      if (t.type === 'expense') map[t.date].expense += toCents(t.amount);
      if (t.type === 'income') map[t.date].income += toCents(t.amount);
    });
    return Object.keys(map).sort().reverse().map((date) => {
      const x = map[date];
      return {
        date,
        expense: fromCents(x.expense),
        income: fromCents(x.income),
        balance: fromCents(x.income - x.expense),
        count: x.count
      };
    });
  }

  /** 某月每天结束时的净资产（只统计计入总资产的账户）。 */
  function assetSeries(data, monthKey) {
    const [year, month] = monthKey.split('-').map(Number);
    const dim = daysInMonth(year, month);
    const balances = {};
    data.accounts.forEach((a) => {
      if (a.include) balances[a.id] = toCents(a.initial); });
    const start = monthKey + '-01';

    function apply(t) {
      if (t.type === 'income' && balances[t.accountId] != null) balances[t.accountId] += toCents(t.amount);
      if (t.type === 'expense' && balances[t.accountId] != null) balances[t.accountId] -= toCents(t.amount);
      if (t.type === 'transfer') {
        if (balances[t.accountId] != null) balances[t.accountId] -= toCents(t.amount);
        if (t.toAccountId && balances[t.toAccountId] != null) balances[t.toAccountId] += toCents(t.amount);
      }
    }
    function sum() {
      return Object.keys(balances).reduce((acc, key) => acc + balances[key], 0);
    }

    data.transactions.forEach((t) => { if (t.date < start) apply(t); });
    const series = [];
    for (let d = 1; d <= dim; d++) {
      const date = monthKey + '-' + pad2(d);
      data.transactions.forEach((t) => { if (t.date === date) apply(t); });
      series.push({ day: d, value: fromCents(sum()) });
    }
    return series;
  }

  function yearRows(data, bookId, startYear, endYear) {
    const rows = [];
    for (let y = startYear; y <= endYear; y++) {
      const t = rangeTotals(data, bookId, y + '-01-01', y + '-12-31');
      rows.push({ year: y, income: t.income, expense: t.expense, balance: t.balance, count: t.count });
    }
    return rows;
  }

  function extendedRangeStats(data, bookId, from, to) {
    const out = {
      transfer: 0, repay: 0, receive: 0, payable: 0, receivable: 0, fee: 0,
      reimburse: 0, reimburseReceived: 0, reimbursePending: 0,
      refund: 0, refundIncome: 0, refundExpense: 0,
      discountExpense: 0, discountIncome: 0, months: 0
    };
    const months = {};
    let hasReimbursePending = false;
    data.transactions.forEach((t) => {
      if (t.bookId !== bookId || t.date < from || t.date > to) return;
      months[t.date.slice(0, 7)] = true;
      const amount = Number(t.amount) || 0;
      if (t.type === 'transfer') out.transfer += amount;
      if (t.type === 'income') out.receive += 0; // 当前数据模型没有独立收款字段
      out.refund += Number(t.refund) || 0;
      if (t.type === 'income') out.refundIncome += Number(t.refund) || 0;
      if (t.type === 'expense') out.refundExpense += Number(t.refund) || 0;
      if (t.type === 'expense') out.discountExpense += Number(t.discount) || 0;
      if (t.type === 'income') out.discountIncome += Number(t.discount) || 0;
      const reimburse = Number(t.reimburseAmount) || 0;
      if (reimburse > 0) {
        out.reimburse += reimburse;
        out.reimbursePending += reimburse;
        hasReimbursePending = true;
      }
    });
    out.reimburseReceived = 0;
    out.months = Object.keys(months).length;
    if (!hasReimbursePending) out.reimbursePending = 0;
    Object.keys(out).forEach((k) => { if (k !== 'months') out[k] = round2(out[k]); });
    return out;
  }

  /** 任意日期区间内每日净资产（含所有账户）。 */
  function assetSeriesRange(data, from, to) {
    const balances = {};
    data.accounts.forEach((a) => { if (a.include) balances[a.id] = toCents(a.initial); });
    function apply(t) {
      if (t.type === 'income' && balances[t.accountId] != null) balances[t.accountId] += toCents(t.amount);
      if (t.type === 'expense' && balances[t.accountId] != null) balances[t.accountId] -= toCents(t.amount);
      if (t.type === 'transfer') {
        if (balances[t.accountId] != null) balances[t.accountId] -= toCents(t.amount);
        if (t.toAccountId && balances[t.toAccountId] != null) balances[t.toAccountId] += toCents(t.amount);
      }
    }
    function sum() { return Object.keys(balances).reduce((acc, key) => acc + balances[key], 0); }
    data.transactions.forEach((t) => { if (t.date < from) apply(t); });
    const series = [];
    let date = from;
    let guard = 0;
    while (date <= to && guard++ < 5000) {
      data.transactions.forEach((t) => { if (t.date === date) apply(t); });
      series.push({ date, value: fromCents(sum()) });
      const d = parseISO(date);
      d.setDate(d.getDate() + 1);
      date = iso(d);
    }
    return series;
  }

  function monthDailySeries(data, bookId, monthKey, type) {
    const [year, month] = monthKey.split('-').map(Number);
    const dim = daysInMonth(year, month);
    const values = [];
    for (let d = 1; d <= dim; d++) {
      const day = monthKey + '-' + pad2(d);
      let expense = 0, income = 0;
      data.transactions.forEach((t) => {
        if (t.bookId !== bookId || t.date !== day) return;
        if (t.type === 'expense') expense += toCents(t.amount);
        if (t.type === 'income') income += toCents(t.amount);
      });
      values.push(type === 'expense' ? fromCents(expense) : type === 'income' ? fromCents(income) : fromCents(income - expense));
    }
    return values;
  }

  function yearMonths(data, bookId, year) {
    const out = [];
    for (let m = 1; m <= 12; m++) {
      const key = year + '-' + pad2(m);
      const t = monthTotals(data, bookId, key);
      out.push({ month: m, key, expense: t.expense, income: t.income, balance: t.balance, count: t.count });
    }
    return out;
  }

  function trendMonths(data, bookId, endMonthKey, n) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const key = addMonthsKey(endMonthKey, -i);
      const t = monthTotals(data, bookId, key);
      out.push({ key, label: shortMonthLabel(key), expense: t.expense, income: t.income });
    }
    return out;
  }

  function budgetStatus(data, bookId, monthKey) {
    const book = data.books.find((b) => b.id === bookId) || activeBook(data);
    const budget = (book && book.budget) || { total: 0, categories: {} };
    const totals = monthTotals(data, bookId, monthKey);
    const total = Math.round(Number(budget.total) * 100) || 0;
    const spent = toCents(totals.expense);
    const categories = [];
    Object.keys(budget.categories || {}).forEach((catId) => {
      const amount = Math.round(Number(budget.categories[catId]) * 100) || 0;
      if (!amount) return;
      const cat = data.categories.find((c) => c.id === catId) || { id: catId, name: '未知分类', icon: '🏷️' };
      const used = data.transactions.reduce((s, t) => (
        t.bookId === bookId && t.type === 'expense' && t.categoryId === catId && monthKeyOf(t.date) === monthKey
          ? s + toCents(t.amount) : s
      ), 0);
      categories.push({
        id: catId, name: cat.name, icon: cat.icon,
        budget: fromCents(amount), spent: fromCents(used),
        percent: amount ? used / amount : 0,
        remain: fromCents(amount - used)
      });
    });
    return {
      total: fromCents(total),
      spent: totals.expense,
      remain: fromCents(total - spent),
      percent: total ? spent / total : 0,
      categories,
      hasBudget: total > 0 || categories.length > 0
    };
  }

  /* ------------------------------------------------------------------ *
   * 周期记账
   * ------------------------------------------------------------------ */

  const FREQ_CN = { daily: '每天', weekly: '每周', monthly: '每月', yearly: '每年' };

  function freqLabel(rule) {
    if (!rule) return '';
    if (rule.freq === 'daily') return '每天';
    if (rule.freq === 'weekly') return '每周' + WEEK_CN[weekdayIndex(rule.startDate)].replace('周', '');
    if (rule.freq === 'monthly') return '每月' + parseISO(rule.startDate).getDate() + '日';
    if (rule.freq === 'yearly') {
      const d = parseISO(rule.startDate);
      return '每年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }
    return '';
  }

  function dueDates(rule, today) {
    if (!rule || rule.enabled === false) return [];
    const end = today || todayISO();
    const startDay = rule.lastRun ? addDaysISO(rule.lastRun, 1) : rule.startDate;
    if (!startDay || startDay > end) return [];
    const out = [];
    const startD = parseISO(startDay);
    const endD = parseISO(end);
    if (rule.freq === 'daily' || rule.freq === 'weekly') {
      const targetWeekday = weekdayIndex(rule.startDate);
      const cursor = new Date(startD);
      let guard = 0;
      while (cursor <= endD && guard++ < 500) {
        if (rule.freq === 'daily' || cursor.getDay() === targetWeekday) out.push(iso(cursor));
        cursor.setDate(cursor.getDate() + 1);
        if (out.length >= 100) break;
      }
    } else if (rule.freq === 'monthly') {
      const day = parseISO(rule.startDate).getDate();
      let y = startD.getFullYear(), m = startD.getMonth();
      let guard = 0;
      while (guard++ < 240) {
        const dim = new Date(y, m + 1, 0).getDate();
        const occ = new Date(y, m, Math.min(day, dim), 12);
        if (occ > endD) break;
        if (iso(occ) >= startDay) out.push(iso(occ));
        m++;
        if (m > 11) { m = 0; y++; }
      }
    } else if (rule.freq === 'yearly') {
      const d = parseISO(rule.startDate);
      const m = d.getMonth(), day = d.getDate();
      let y = startD.getFullYear();
      let guard = 0;
      while (guard++ < 60) {
        const dim = new Date(y, m + 1, 0).getDate();
        const occ = new Date(y, m, Math.min(day, dim), 12);
        if (occ > endD) break;
        if (iso(occ) >= startDay) out.push(iso(occ));
        y++;
      }
    }
    return out.slice(0, 100);
  }

  function applyRecurring(data, today) {
    const end = today || todayISO();
    let created = 0;
    (data.recurring || []).forEach((rule) => {
      if (!rule.enabled) return;
      const dates = dueDates(rule, end);
      if (!dates.length) return;
      dates.forEach((day) => {
        data.transactions.push({
          id: uid('t'), bookId: rule.bookId, type: rule.type,
          amount: round2(rule.amount), categoryId: rule.categoryId,
          accountId: rule.accountId, toAccountId: null,
          date: day, time: '09:00', note: rule.note || '',
          tags: [], recurringId: rule.id,
          createdAt: new Date().toISOString(), updatedAt: null
        });
        created++;
      });
      rule.lastRun = dates[dates.length - 1];
    });
    if (created) {
      data.transactions.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    }
    return created;
  }

  /* ------------------------------------------------------------------ *
   * 导入 / 导出
   * ------------------------------------------------------------------ */

  function csvCell(v) {
    const s = v == null ? '' : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function plainMoney(n) {
    return (Math.round((Number(n) || 0) * 100) / 100).toFixed(2);
  }

  function parseImportNumber(value) {
    if (typeof value === 'number') return isFinite(value) ? value : 0;
    const text = String(value == null ? '' : value).replace(/[¥￥$€£\s,，]/g, '');
    if (!text) return 0;
    const n = Number(text);
    return isFinite(n) ? n : 0;
  }

  function normalizeBillDate(value) {
    if (typeof value === 'number' && value > 0) {
      const whole = Math.floor(value);
      const frac = value - whole;
      const ms = Math.round((whole - 25569) * 86400 * 1000 + Math.round(frac * 86400) * 1000);
      const d = new Date(ms);
      if (!isNaN(d.getTime())) {
        return {
          date: d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()),
          time: pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes())
        };
      }
    }
    let text = String(value == null ? '' : value).trim();
    if (!text) return null;
    text = text.replace(/[年月]/g, '-').replace(/日/g, '').replace(/[./]/g, '-');
    const m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{1,2}))?/.exec(text);
    if (!m) return null;
    const month = Number(m[2]);
    const day = Number(m[3]);
    if (month < 1 || month > 12 || day < 1 || day > 31) return null;
    return {
      date: m[1] + '-' + pad2(month) + '-' + pad2(day),
      time: m[4] != null ? pad2(Number(m[4])) + ':' + pad2(Number(m[5] || 0)) : ''
    };
  }

  function splitTags(value) {
    return String(value == null ? '' : value)
      .split(/[,，、;；\s]+/)
      .map((x) => x.trim())
      .filter(Boolean)
      .slice(0, 12);
  }

  function currencyInfo(value) {
    const text = String(value == null ? '' : value).trim();
    if (!text) return { currency: '', foreignAmount: 0 };
    const m = /^([A-Za-z]{2,6})\s*([\d.,]+)?$/.exec(text);
    if (m) return { currency: m[1].toUpperCase(), foreignAmount: Math.abs(parseImportNumber(m[2] || 0)) };
    return { currency: text.slice(0, 12), foreignAmount: 0 };
  }

  /** 导出用的整表：表头 + 每行值（金额类为数字，其余为字符串）。 */
  function billRows(data, bookId) {
    const books = {};
    data.books.forEach((b) => { books[b.id] = b; });
    const cats = categoryMap(data);
    const accs = accountMap(data);
    const list = sortTransactions(data.transactions.filter((t) => !bookId || t.bookId === bookId)).reverse();
    const rows = list.map((t) => {
      const cat = cats[t.categoryId];
      const from = accs[t.accountId];
      const to = accs[t.toAccountId];
      const currency = t.currency
        ? (t.foreignAmount ? t.currency + ' ' + plainMoney(t.foreignAmount) : t.currency)
        : '';
      const attachments = (t.attachments || []).slice(0, 5);
      const row = [
        t.date,
        TYPE_CN[t.type] || t.type,
        round2(t.amount),
        t.type === 'transfer' ? '' : (cat ? cat.name : '未分类'),
        t.type === 'transfer' ? '' : (t.subcategory || ''),
        t.type === 'transfer'
          ? ((from ? from.name : '') + ' → ' + (to ? to.name : ''))
          : (from ? from.name : ''),
        books[t.bookId] ? books[t.bookId].name : '',
        t.refund ? round2(t.refund) : '',
        t.discount ? round2(t.discount) : '',
        t.note || '',
        (t.tags || []).join('、'),
        t.reimburseAccount || '',
        t.reimburseAmount ? round2(t.reimburseAmount) : '',
        t.reimburseNote || '',
        currency,
        t.location || '',
        t.creator || '',
        t.extra || ''
      ];
      for (let i = 0; i < 5; i++) row.push(attachments[i] ? attachments[i].name : '');
      return row;
    });
    return { headers: BILL_HEADERS.slice(), rows };
  }

  function toCSV(data, bookId) {
    const table = billRows(data, bookId);
    const lines = [table.headers.map(csvCell).join(',')];
    table.rows.forEach((row) => {
      lines.push(row.map((value, i) => {
        if (BILL_NUMERIC.indexOf(table.headers[i]) >= 0) {
          return csvCell(value === '' ? '' : plainMoney(value));
        }
        return csvCell(value);
      }).join(','));
    });
    return '\ufeff' + lines.join('\r\n');
  }

  function parseCSV(text) {
    const src = String(text == null ? '' : text).replace(/^\ufeff/, '');
    const rows = [];
    let row = [];
    let cell = '';
    let quoted = false;
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      if (quoted) {
        if (ch === '"') {
          if (src[i + 1] === '"') { cell += '"'; i++; }
          else quoted = false;
        } else cell += ch;
      } else if (ch === '"') {
        quoted = true;
      } else if (ch === ',') {
        row.push(cell); cell = '';
      } else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && src[i + 1] === '\n') i++;
        row.push(cell); cell = '';
        if (row.some((c) => String(c).trim() !== '')) rows.push(row);
        row = [];
      } else {
        cell += ch;
      }
    }
    if (cell !== '' || row.length) {
      row.push(cell);
      if (row.some((c) => String(c).trim() !== '')) rows.push(row);
    }
    return rows;
  }

  /**
   * 把 Excel / CSV 行合并进现有数据。
   * rows[0] 为表头；支持新表头，以及旧版「日期/时间/类型/分类...」表头。
   */
  function importBillRows(data, rows, options) {
    const opts = options || {};
    const result = { imported: 0, skipped: 0, books: 0, categories: 0, accounts: 0, error: '' };
    if (!Array.isArray(rows) || rows.length < 2) {
      result.error = '没有可导入的数据行';
      return result;
    }
    const headers = rows[0].map((h) => String(h == null ? '' : h).trim());
    const index = {};
    headers.forEach((h, i) => { if (h && index[h] == null) index[h] = i; });
    const col = function () {
      for (let i = 0; i < arguments.length; i++) {
        if (index[arguments[i]] != null) return index[arguments[i]];
      }
      return -1;
    };
    const dateCol = col('日期');
    const amountCol = col('金额');
    const typeCol = col('收支类型', '类型');
    const timeCol = col('时间');
    if (dateCol < 0 || amountCol < 0) {
      result.error = '缺少「日期」或「金额」列';
      return result;
    }
    const get = (row, name) => (index[name] != null ? row[index[name]] : '');
    const bookByName = {};
    data.books.forEach((b) => { bookByName[b.name] = b.id; });
    const catByKey = {};
    data.categories.forEach((c) => { catByKey[c.type + '|' + c.name] = c.id; });
    const accByName = {};
    data.accounts.forEach((a) => {
      accByName[a.name] = a.id; });

    function ensureBook(name) {
      const text = String(name == null ? '' : name).trim();
      if (!text) return data.activeBookId;
      if (bookByName[text]) return bookByName[text];
      const book = {
        id: uid('b'), name: text, icon: '📒', color: '#0e9f6e',
        budget: { total: 0, categories: {} }, createdAt: new Date().toISOString()
      };
      data.books.push(book);
      bookByName[text] = book.id;
      result.books++;
      return book.id;
    }

    function ensureCategory(name, type) {
      const text = String(name == null ? '' : name).trim();
      if (!text) return null;
      const key = type + '|' + text;
      if (catByKey[key]) return catByKey[key];
      const orders = data.categories.filter((c) => c.type === type).map((c) => c.order || 0);
      const cat = {
        id: uid('c'), name: text, icon: '🏷️', color: '#94a3b8', type: type,
        order: Math.max.apply(null, orders.concat([0])) + 1, builtin: false
      };
      data.categories.push(cat);
      catByKey[key] = cat.id;
      result.categories++;
      return cat.id;
    }

    function ensureAccount(name) {
      const text = String(name == null ? '' : name).trim();
      if (!text) return data.accounts[0] ? data.accounts[0].id : null;
      if (accByName[text]) return accByName[text];
      const acc = {
        id: uid('a'), name: text, type: 'other', icon: '👛', color: '#94a3b8',
        initial: 0, include: true
      };
      data.accounts.push(acc);
      accByName[text] = acc.id;
      result.accounts++;
      return acc.id;
    }

    const existing = new Set();
    function dedupeKey(t) {
      return [t.date, t.type, round2(t.amount), t.categoryId || '', t.accountId || '', t.toAccountId || '', t.note || ''].join('|');
    }
    data.transactions.forEach((t) => existing.add(dedupeKey(t)));

    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || !row.some((c) => String(c == null ? '' : c).trim() !== '')) continue;
      const dateInfo = normalizeBillDate(row[dateCol]);
      const amount = Math.abs(parseImportNumber(row[amountCol]));
      if (!dateInfo || !(amount > 0)) { result.skipped++; continue; }

      const typeText = typeCol >= 0 ? String(row[typeCol] || '') : '';
      let type = 'expense';
      if (typeText.indexOf('收入') >= 0) type = 'income';
      else if (typeText.indexOf('转账') >= 0 || typeText.indexOf('轉賬') >= 0) type = 'transfer';

      const bookId = ensureBook(get(row, '账本'));
      const categoryName = get(row, '类别') || get(row, '分类');
      const subcategory = String(get(row, '二级分类') || '').slice(0, 20);
      const tagCandidates = (data.tags || []).concat(
        (data.categories || []).map((c) => c.name),
        BUILTIN_TAGS
      );
      const tags = Array.from(new Set(splitTags(get(row, '标签'))
        .map((tag) => canonicalTag(tag, tagCandidates))
        .filter(Boolean)));
      let categoryId = null;
      let accountId = null;
      let toAccountId = null;

      if (type === 'transfer') {
        const rawAccount = String(get(row, '账户') || '').trim();
        const parts = rawAccount.split(/\s*(?:→|->|=>)\s*/).filter(Boolean);
        if (parts.length >= 2) {
          accountId = ensureAccount(parts[0]);
          toAccountId = ensureAccount(parts[1]);
        } else {
          accountId = ensureAccount(parts[0] || '');
          toAccountId = ensureAccount(get(row, '转入账户'));
        }
        if (!accountId || !toAccountId || accountId === toAccountId) { result.skipped++; continue; }
      } else {
        categoryId = ensureCategory(categoryName, type);
        accountId = ensureAccount(get(row, '账户'));
      }

      const cur = currencyInfo(get(row, '多币种'));
      const attachments = [];
      for (let a = 1; a <= 5; a++) {
        const name = String(get(row, '附件' + a) || '').trim();
        if (name) attachments.push({ name: name.slice(0, 120), dataUrl: null, type: '' });
      }
      const tx = {
        id: uid('t'), bookId, type,
        amount: round2(amount),
        categoryId, accountId, toAccountId,
        date: dateInfo.date,
        time: dateInfo.time || (timeCol >= 0 ? String(row[timeCol] || '').slice(0, 5) : '') || '12:00',
        note: String(get(row, '备注') || ''),
        tags,
        subcategory: type === 'transfer' ? '' : subcategory,
        refund: Math.max(0, round2(parseImportNumber(get(row, '退款')))),
        discount: Math.max(0, round2(parseImportNumber(get(row, '优惠')))),
        reimburseAccount: String(get(row, '报销账户') || ''),
        reimburseAmount: Math.max(0, round2(parseImportNumber(get(row, '报销金额')))),
        reimburseNote: String(get(row, '报销明细') || ''),
        currency: cur.currency,
        foreignAmount: cur.foreignAmount,
        location: String(get(row, '地址') || ''),
        creator: String(get(row, '创建用户') || ''),
        extra: String(get(row, '其他') || ''),
        attachments,
        recurringId: null,
        createdAt: new Date().toISOString(),
        updatedAt: null
      };
      const key = dedupeKey(tx);
      if (opts.dedupe !== false && existing.has(key)) { result.skipped++; continue; }
      existing.add(key);
      data.transactions.push(tx);
      tags.forEach((tag) => { if (data.tags.indexOf(tag) < 0) data.tags.push(tag); });
      result.imported++;
    }

    if (result.imported) data.transactions.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    return result;
  }

  function exportPayload(data) {
    return {
      app: '星空记账 · 本地版',
      version: VERSION,
      exportedAt: new Date().toISOString(),
      data: JSON.parse(JSON.stringify(data))
    };
  }

  /* ------------------------------------------------------------------ *
   * 其它统计
   * ------------------------------------------------------------------ */

  function overallStats(data) {
    const days = new Set();
    data.transactions.forEach((t) => days.add(t.date));
    const sorted = Array.from(days).sort();
    let streak = 0;
    let cursor = todayISO();
    if (!days.has(cursor)) cursor = addDaysISO(cursor, -1);
    while (days.has(cursor)) {
      streak++;
      cursor = addDaysISO(cursor, -1);
    }
    return {
      count: data.transactions.length,
      days: days.size,
      streak,
      books: data.books.length,
      categories: data.categories.length,
      firstDate: sorted[0] || null,
      lastDate: sorted[sorted.length - 1] || null
    };
  }

  function recentTags(data, limit) {
    const counts = {};
    data.transactions.forEach((t) => (t.tags || []).forEach((tag) => {
      counts[tag] = (counts[tag] || 0) + 1;
    }));
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, limit || 12);
  }

  const BUILTIN_TAGS = ['餐饮', '交通', '购物', '居住', '娱乐', '医疗', '学习', '通讯', '人情', '旅行', '宠物', '运动', '工资', '理财', '兼职', '红包', '报销', '固定支出', '日常'];

  function tagKey(value) {
    return String(value || '').replace(/\s+/g, '').replace(/[，,、#·.\-_/\\()（）]/g, '').toLowerCase();
  }

  function tagDice(a, b) {
    if (a === b) return 1;
    if (a.length < 2 || b.length < 2) return 0;
    const grams = (s) => {
      const arr = [];
      for (let i = 0; i < s.length - 1; i++) arr.push(s.slice(i, i + 2));
      return arr;
    };
    const ga = grams(a), gb = grams(b);
    const map = {};
    ga.forEach((g) => { map[g] = (map[g] || 0) + 1; });
    let hit = 0;
    gb.forEach((g) => { if (map[g]) { hit++; map[g]--; } });
    return (2 * hit) / (ga.length + gb.length);
  }

  /** 将导入标签归到最相近的内置/已有标签；匹配不可靠时保留原标签。 */
  function canonicalTag(raw, candidates) {
    const original = normalizeTag(raw);
    const a = tagKey(original);
    if (!a) return '';
    const list = [];
    const seen = {};
    (candidates || []).forEach((value) => {
      const originalValue = String(value || '').trim();
      const b = tagKey(originalValue);
      if (!b || seen[b]) return;
      seen[b] = true;
      list.push({ original: originalValue, key: b });
    });
    let best = null;
    let bestScore = 0;
    list.forEach((item) => {
      const b = item.key;
      let score = 0;
      if (a === b) score = 1;
      else if (b.length >= 2 && a.indexOf(b) >= 0) {
        score = 0.86 + 0.12 * Math.min(b.length / a.length, 1);
      } else if (a.length >= 2 && b.indexOf(a) >= 0) {
        score = 0.82 + 0.1 * Math.min(a.length / b.length, 1);
      } else {
        const dice = tagDice(a, b);
        if (dice >= 0.66) score = dice * 0.9;
      }
      if (score > bestScore) { bestScore = score; best = item.original; }
    });
    if (best && bestScore >= 0.72) return normalizeTag(best);
    return original;
  }

  function normalizeTag(tag) {
    return String(tag || '').trim().replace(/[#,，、]/g, '').slice(0, 12);
  }

  return {
    VERSION,
    WEEK_CN,
    TYPE_CN,
    BILL_HEADERS,
    BILL_NUMERIC,
    FREQ_CN,
    ACCOUNT_TYPES,
    uid,
    iso,
    parseISO,
    todayISO,
    thisMonthKey,
    monthKeyOf,
    daysInMonth,
    monthStart,
    monthEnd,
    addDaysISO,
    addMonthsKey,
    weekdayIndex,
    weekdayCN,
    monthLabel,
    shortMonthLabel,
    dateLabel,
    fullDateLabel,
    relativeDay,
    monthDays,
    monthsBetween,
    calendarLabel,
    chineseLunarDay,
    toCents,
    fromCents,
    round2,
    money,
    amountParts,
    parseAmountExpr,
    makeCategories,
    createDefaultData,
    seedDemoData,
    migrateData,
    validateBackup,
    categoryMap,
    accountMap,
    activeBook,
    categoriesOf,
    sortTransactions,
    bookTransactions,
    filterTransactions,
    monthTotals,
    rangeTotals,
    categoryBreakdownRange,
    dailyRows,
    assetSeries,
    assetSeriesRange,
    yearRows,
    extendedRangeStats,
    monthDailySeries,
    yearMonths,
    dayTotals,
    categoryBreakdown,
    accountBalances,
    totalAssets,
    accountMonthFlow,
    trendMonths,
    budgetStatus,
    freqLabel,
    dueDates,
    applyRecurring,
    csvCell,
    toCSV,
    billRows,
    parseCSV,
    importBillRows,
    normalizeBillDate,
    parseImportNumber,
    exportPayload,
    overallStats,
    recentTags,
    normalizeTag,
    canonicalTag,
    BUILTIN_TAGS
  };
});

  <script>
/*
 * 星空记账 · 图表
 * 内联 SVG：环形占比、柱状图（支持负数）、折线、收支桑基图。
 */
(function (root) {
  'use strict';

  const FONT = "-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif";
  let gradSeq = 0;

  function sizeOf(el, fallbackW, fallbackH) {
    const w = Math.round(el.clientWidth || (el.getBoundingClientRect && el.getBoundingClientRect().width) || fallbackW);
    const h = Math.round(el.clientHeight || (el.getBoundingClientRect && el.getBoundingClientRect().height) || fallbackH);
    return { w: Math.max(80, w), h: Math.max(60, h) };
  }

  function svgOpen(w, h) {
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="100%" role="img" ' +
      'font-family="' + FONT + '" xmlns="http://www.w3.org/2000/svg">';
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    return 'M' + (x + rr) + ',' + y +
      ' H' + (x + w - rr) + ' A' + rr + ',' + rr + ' 0 0 1 ' + (x + w) + ',' + (y + rr) +
      ' V' + (y + h) +
      ' H' + x + ' V' + (y + rr) + ' A' + rr + ',' + rr + ' 0 0 1 ' + (x + rr) + ',' + y + ' Z';
  }

  function compact(n) {
    const v = Number(n) || 0;
    const a = Math.abs(v);
    if (a >= 100000) return (v / 10000).toFixed(0) + '万';
    if (a >= 10000) return (v / 10000).toFixed(1) + '万';
    if (a >= 1000) return (v / 1000).toFixed(1) + 'k';
    return String(Math.round(v));
  }

  function niceStep(raw) {
    const exp = Math.pow(10, Math.floor(Math.log10(Math.max(Math.abs(raw), 1e-6))));
    const n = Math.abs(raw) / exp;
    const base = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return base * exp;
  }

  function xmlEscape(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function donut(el, items, opts) {
    if (!el) return;
    const o = opts || {};
    const { w, h } = sizeOf(el, 176, 176);
    const cx = w / 2, cy = h / 2;
    const thickness = o.thickness || Math.max(12, Math.min(w, h) * 0.115);
    const radius = Math.min(w, h) / 2 - thickness / 2 - 3;
    const total = items.reduce((s, it) => s + (Number(it.value) || 0), 0);
    const emptyColor = o.emptyColor || 'rgba(148,163,184,.18)';
    let inner = '';

    if (!total) {
      inner = '<circle cx="' + cx + '" cy="' + cy + '" r="' + radius + '" fill="none" stroke="' + emptyColor +
        '" stroke-width="' + thickness + '"/>';
    } else {
      const start = -Math.PI / 2;
      const gap = items.length > 1 ? Math.min(0.035, Math.PI * 0.012) : 0;
      let angle = start;
      items.forEach((it) => {
        const value = Math.max(0, Number(it.value) || 0);
        if (!value) return;
        const sweep = (value / total) * Math.PI * 2;
        const a1 = angle + gap / 2;
        const a2 = angle + sweep - gap / 2;
        if (a2 > a1) {
          const x1 = cx + radius * Math.cos(a1);
          const y1 = cy + radius * Math.sin(a1);
          const x2 = cx + radius * Math.cos(a2);
          const y2 = cy + radius * Math.sin(a2);
          const large = sweep > Math.PI ? 1 : 0;
          inner += '<path d="M' + x1.toFixed(2) + ',' + y1.toFixed(2) +
            ' A' + radius + ',' + radius + ' 0 ' + large + ' 1 ' + x2.toFixed(2) + ',' + y2.toFixed(2) + '" ' +
            'fill="none" stroke="' + (it.color || '#0e9f6e') + '" stroke-width="' + thickness + '" stroke-linecap="butt"/>';
        }
        angle += sweep;
      });
    }
    el.innerHTML = svgOpen(w, h) + inner + '</svg>';
  }

  /** 柱状图，支持单/多系列、负值、数值标签、Y 轴刻度。 */
  function bars(el, data, opts) {
    if (!el) return;
    const o = opts || {};
    const { w, h } = sizeOf(el, 340, 170);
    const labels = data.labels || [];
    const series = (data.series && data.series.length ? data.series : [{ values: data.values || [], color: o.color }]).map((s) => ({
      values: (s.values || []).map((v) => Number(v) || 0),
      color: s.color || o.color || '#0e9f6e',
      name: s.name || ''
    }));
    const allValues = series.reduce((arr, s) => arr.concat(s.values), []);
    const n = labels.length;
    const showValues = !!o.showValues && series.length === 1;
    const axis = !!o.axis;
    const padL = axis ? 32 : 6;
    const padR = 8;
    const padTop = showValues ? 24 : 18;
    const padBottom = 22;
    const plotW = w - padL - padR;
    const plotH = h - padTop - padBottom;
    const maxV = Math.max(0, Math.max.apply(null, allValues.concat([0])));
    const minV = Math.min(0, Math.min.apply(null, allValues.concat([0])));
    const maxAbs = Math.max(Math.abs(maxV), Math.abs(minV), 1);
    const step = niceStep(maxAbs / 3);
    const top = Math.max(step, Math.ceil(maxV / step) * step);
    const bottom = minV < 0 ? -Math.max(step, Math.ceil(-minV / step) * step) : 0;
    const domain = Math.max(top - bottom, step);
    const zeroY = padTop + plotH - ((0 - bottom) / domain) * plotH;
    const yOf = (v) => padTop + plotH - ((v - bottom) / domain) * plotH;
    const gridColor = o.gridColor || 'rgba(148,163,184,.18)';
    const labelColor = o.labelColor || 'rgba(100,116,139,.85)';
    const textColor = o.textColor || '#101c16';
    const negativeColor = o.negativeColor || '#e5484d';
    const highlight = data.highlight == null ? n - 1 : data.highlight;
    const nLabel = n <= 12 ? 1 : (o.labelEvery || 2);
    let inner = '';

    for (let i = 0; i <= 4; i++) {
      const v = bottom + (domain * i) / 4;
      const y = yOf(v);
      inner += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y.toFixed(1) +
        '" stroke="' + gridColor + '" stroke-width="1" stroke-dasharray="3 5"/>';
      if (axis) {
        inner += '<text x="' + (padL - 5) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="' + labelColor + '">' +
          compact(v) + '</text>';
      }
    }
    if (bottom < 0) {
      inner += '<line x1="' + padL + '" y1="' + zeroY.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + zeroY.toFixed(1) +
        '" stroke="' + (o.zeroColor || 'rgba(100,116,139,.35)') + '" stroke-width="1"/>';
    }

    const slot = plotW / Math.max(n, 1);
    const groupW = Math.min(series.length > 1 ? slot * 0.74 : (o.barWidth || 22), slot * 0.74);
    const bw = series.length > 1 ? groupW / series.length : Math.min(o.barWidth || 22, slot * 0.56);
    const baseX = (i) => padL + slot * i + (slot - (series.length > 1 ? groupW : bw)) / 2;
    for (let i = 0; i < n; i++) {
      series.forEach((s, si) => {
        const v = s.values[i] || 0;
        const x = baseX(i) + (series.length > 1 ? si * bw : 0);
        const yTop = Math.min(yOf(0), yOf(v));
        const bh = Math.max(Math.abs(yOf(v) - yOf(0)), v === 0 ? 0 : 2);
        const hot = i === highlight;
        const color = v < 0 ? negativeColor : (series.length > 1 ? s.color : (hot ? (s.color || o.color || '#0e9f6e') : (o.mutedColor || 'rgba(14,159,110,.28)')));
        if (bh > 0) inner += '<path d="' + roundRect(x, yTop, bw, bh, Math.min(6, bw / 2)) + '" fill="' + color + '"/>';
        if (showValues && n <= 16 && v !== 0) {
          const labelY = v >= 0 ? Math.max(11, yTop - 6) : Math.min(h - 4, yTop + bh + 12);
          inner += '<text x="' + (x + bw / 2) + '" y="' + labelY + '" text-anchor="middle" font-size="9.5" font-weight="600" fill="' +
            (v < 0 ? negativeColor : textColor) + '">' + compact(v) + '</text>';
        }
      });
      if (i % nLabel === 0 || i === n - 1) {
        inner += '<text x="' + (padL + slot * i + slot / 2) + '" y="' + (h - 5) + '" text-anchor="middle" font-size="9.5" font-weight="' +
          (i === highlight ? 600 : 500) + '" fill="' + labelColor + '">' + xmlEscape(labels[i] || '') + '</text>';
      }
    }
    el.innerHTML = svgOpen(w, h) + inner + '</svg>';
  }

  /** 折线图；支持单/多系列；domain='minmax' 用于资产走势。 */
  function line(el, data, opts) {
    if (!el) return;
    const o = opts || {};
    const { w, h } = sizeOf(el, 340, 130);
    const axis = !!o.axis;
    const padL = axis ? 34 : 8;
    const padR = 8, padTop = 14, padBottom = 18;
    const plotW = w - padL - padR;
    const plotH = h - padTop - padBottom;
    const labels = data.labels || [];
    const series = (data.series && data.series.length ? data.series : [{ values: data.values || [], color: o.color }]).map((s) => ({
      values: (s.values || []).map((v) => Number(v) || 0),
      color: s.color || o.color || '#0e9f6e',
      name: s.name || ''
    }));
    const allValues = series.reduce((arr, s) => arr.concat(s.values), []);
    let minV = 0;
    let maxV = Math.max.apply(null, allValues.concat([1]));
    if (o.domain === 'minmax') {
      minV = Math.min.apply(null, allValues);
      maxV = Math.max.apply(null, allValues);
      const pad = (maxV - minV || 1) * 0.08;
      minV -= pad; maxV += pad;
    }
    if (series.length > 1) minV = Math.min(minV, 0);
    const range = Math.max(maxV - minV, 1e-6);
    const n = labels.length;
    const xOf = (i) => padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1));
    const yOf = (v) => padTop + plotH - ((v - minV) / range) * plotH;
    const gridColor = o.gridColor || 'rgba(148,163,184,.16)';
    const labelColor = o.labelColor || 'rgba(100,116,139,.8)';
    let inner = '';

    if (axis) {
      for (let i = 0; i <= 3; i++) {
        const v = minV + (range * i) / 3;
        const y = padTop + plotH - (plotH * i) / 3;
        inner += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y.toFixed(1) +
          '" stroke="' + gridColor + '" stroke-width="1" stroke-dasharray="3 5"/>' +
          '<text x="' + (padL - 5) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="8.5" fill="' + labelColor + '">' +
          compact(v) + '</text>';
      }
    }

    series.forEach((s, si) => {
      const pts = s.values.map((v, i) => ({ x: xOf(i), y: yOf(v) }));
      const lineD = pts.map((p, i) => {
        if (i === 0) return 'M' + p.x.toFixed(1) + ',' + p.y.toFixed(1);
        const prev = pts[i - 1];
        const mx = (prev.x + p.x) / 2;
        return 'C' + mx.toFixed(1) + ',' + prev.y.toFixed(1) + ' ' + mx.toFixed(1) + ',' + p.y.toFixed(1) +
          ' ' + p.x.toFixed(1) + ',' + p.y.toFixed(1);
      }).join(' ');
      if (series.length === 1) {
        const id = 'grad' + (++gradSeq);
        const areaPath = lineD + ' L' + pts[n - 1].x.toFixed(1) + ',' + (padTop + plotH) +
          ' L' + pts[0].x.toFixed(1) + ',' + (padTop + plotH) + ' Z';
        inner += '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="' + s.color + '" stop-opacity="0.22"/>' +
          '<stop offset="1" stop-color="' + s.color + '" stop-opacity="0"/>' +
          '</linearGradient></defs><path d="' + areaPath + '" fill="url(#' + id + ')"/>';
      }
      inner += '<path d="' + lineD + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      let maxIdx = 0;
      s.values.forEach((v, i) => { if (v > s.values[maxIdx]) maxIdx = i; });
      if (o.dot !== false && series.length === 1) {
        const p = pts[maxIdx];
        inner += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.2" fill="' + s.color + '" stroke="#fff" stroke-width="1.3"/>';
      }
    });
    inner += '<text x="' + padL + '" y="' + (h - 4) + '" font-size="9.5" fill="' + labelColor + '">' + xmlEscape(labels[0] || '') + '</text>' +
      '<text x="' + (w - padR) + '" y="' + (h - 4) + '" text-anchor="end" font-size="9.5" fill="' + labelColor + '">' +
      xmlEscape(labels[labels.length - 1] || '') + '</text>';
    el.innerHTML = svgOpen(w, h) + inner + '</svg>';
  }

  /** 收支桑基图：收入 → 支出分类 + 结余。 */
  function sankey(el, data, opts) {
    if (!el) return;
    const o = opts || {};
    const { w, h } = sizeOf(el, 340, 220);
    const income = Math.max(0, Number(data.income) || 0);
    const expense = Math.max(0, Number(data.expense) || 0);
    const balance = Math.max(0, income - expense);
    const nodes = (data.nodes || []).filter((n) => n && Number(n.value) > 0);
    if (balance > 0) nodes.push({ name: '结余', value: balance, color: '#0e9f6e', balance: true });
    if (!nodes.length && !income) {
      el.innerHTML = svgOpen(w, h) + '<text x="' + (w / 2) + '" y="' + (h / 2) + '" text-anchor="middle" font-size="12" fill="#93a29a">本月没有收支数据</text></svg>';
      return;
    }
    const totalOut = nodes.reduce((s, n) => s + Number(n.value), 0) || expense;
    const scaleTotal = Math.max(income, totalOut, 1);
    const padTop = 30, padBottom = 18;
    const plotH = h - padTop - padBottom;
    const gap = 7;
    const avail = plotH - gap * Math.max(0, nodes.length - 1);
    const scale = Math.max(0.0001, avail / scaleTotal);
    const leftX = 8, leftW = 9;
    const centerX = Math.round(w * 0.44), centerW = 12;
    const rightX = w - 34, rightW = 8;
    const leftH = Math.max(1, income * scale);
    const leftY = padTop + (plotH - leftH) / 2;
    const centerTop = padTop;
    const centerH = Math.max(1, totalOut * scale) + gap * Math.max(0, nodes.length - 1);
    const centerY = padTop + (plotH - centerH) / 2;

    let inner = '';
    // 左：收入 → 中央
    inner += '<path d="M' + (leftX + leftW) + ',' + leftY.toFixed(1) +
      ' C' + (centerX - 22) + ',' + leftY.toFixed(1) + ' ' + (centerX - 22) + ',' + centerTop.toFixed(1) +
      ' ' + centerX + ',' + centerTop.toFixed(1) +
      ' L' + centerX + ',' + (centerTop + centerH).toFixed(1) +
      ' C' + (centerX - 22) + ',' + (centerTop + centerH).toFixed(1) + ' ' + (centerX - 22) + ',' + (leftY + leftH).toFixed(1) +
      ' ' + (leftX + leftW) + ',' + (leftY + leftH).toFixed(1) + ' Z" fill="rgba(14,159,110,.18)"/>';
    inner += '<rect x="' + leftX + '" y="' + leftY.toFixed(1) + '" width="' + leftW + '" height="' + leftH.toFixed(1) +
      '" rx="4" fill="#0e9f6e"/>';
    inner += '<text x="' + leftX + '" y="' + (padTop - 12) + '" font-size="9" fill="#5b6d64">收入</text>' +
      '<text x="' + leftX + '" y="' + (padTop - 2) + '" font-size="10" font-weight="700" fill="#0e9f6e">¥' + compact(income) + '</text>';

    // 中：汇总条
    inner += '<rect x="' + centerX + '" y="' + centerY.toFixed(1) + '" width="' + centerW + '" height="' + centerH.toFixed(1) +
      '" rx="3" fill="#0e9f6e"/>' +
      '<text x="' + (centerX + centerW / 2) + '" y="' + (padTop - 12) + '" text-anchor="middle" font-size="9" fill="#5b6d64">支出</text>' +
      '<text x="' + (centerX + centerW / 2) + '" y="' + (padTop - 2) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#e5484d">¥' + compact(expense) + '</text>';

    // 右：分类 / 结余
    let rightY = padTop;
    let centerCursor = centerY;
    nodes.forEach((node, i) => {
      const nh = Math.max(1, Number(node.value) * scale);
      const nodeColor = node.color || (node.balance ? '#0e9f6e' : '#f59e0b');
      const ny = rightY;
      const startY = centerCursor;
      const endY = centerCursor + nh;
      centerCursor = endY + gap;
      rightY += nh + gap;
      // 流带
      const x1 = centerX + centerW;
      const x2 = rightX;
      inner += '<path d="M' + x1 + ',' + startY.toFixed(1) +
        ' C' + (x1 + 30) + ',' + startY.toFixed(1) + ' ' + (x2 - 30) + ',' + ny.toFixed(1) + ' ' + x2 + ',' + ny.toFixed(1) +
        ' L' + x2 + ',' + (ny + nh).toFixed(1) +
        ' C' + (x2 - 30) + ',' + (ny + nh).toFixed(1) + ' ' + (x1 + 30) + ',' + endY.toFixed(1) + ' ' + x1 + ',' + endY.toFixed(1) + ' Z" ' +
        'fill="' + nodeColor + '" fill-opacity="' + (node.balance ? '0.32' : '0.22') + '"/>';
      inner += '<rect x="' + rightX + '" y="' + ny.toFixed(1) + '" width="' + rightW + '" height="' + nh.toFixed(1) +
        '" rx="3" fill="' + nodeColor + '"/>';
    });

    if (expense > income) {
      inner += '<text x="' + (w - 8) + '" y="' + (h - 3) + '" text-anchor="end" font-size="9" fill="#e5484d">本月超支 ¥' +
        (expense - income).toFixed(2) + '</text>';
    }
    el.innerHTML = svgOpen(w, h) + inner + '</svg>';
  }

  root.LedgerCharts = { donut, bars, line, sankey };
})(typeof self !== 'undefined' ? self : this);

</script>
  <script>
/*
 * 星空记账 · Excel (.xlsx) 读写
 * 不依赖任何第三方库：自己写 ZIP（store）+ SpreadsheetML XML。
 * 导出使用保留压缩方式，任何 Excel/WPS 都能打开；导入依赖浏览器
 * 的 DecompressionStream('deflate-raw') 解压 Excel 生成的 xlsx。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.LedgerXlsx = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * CRC32 / ZIP（store）
   * ------------------------------------------------------------------ */

  const CRC_TABLE = (function () {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function zipStore(files) {
    const encoder = new TextEncoder();
    const locals = [];
    const centrals = [];
    let offset = 0;
    // 1980-01-01 00:00
    const dosTime = 0;
    const dosDate = (1 << 5) | 1;

    files.forEach((file) => {
      const name = encoder.encode(file.name);
      const data = file.data;
      const crc = crc32(data);
      const local = new Uint8Array(30 + name.length + data.length);
      const lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034B50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, name.length, true);
      lv.setUint16(28, 0, true);
      local.set(name, 30);
      local.set(data, 30 + name.length);
      locals.push(local);

      const central = new Uint8Array(46 + name.length);
      const cv = new DataView(central.buffer);
      cv.setUint32(0, 0x02014B50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, name.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, offset, true);
      central.set(name, 46);
      centrals.push(central);

      offset += local.length;
    });

    const centralSize = centrals.reduce((sum, c) => sum + c.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054B50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    const total = offset + centralSize + end.length;
    const out = new Uint8Array(total);

    locals.concat(centrals, [end]).forEach((chunk) => {
      out.set(chunk, pos);
      pos += chunk.length;
    });
    return out;
  }

  /* ------------------------------------------------------------------ *
   * XML 工具
   * ------------------------------------------------------------------ */

  function xmlEscape(value) {

      .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  function colLetter(index) {
    let n = index + 1;
    let s = '';
    while (n > 0) {
      const m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  const CONTENT_TYPES =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
    '</Types>';

  const ROOT_RELS =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';

  const WORKBOOK =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets><sheet name="账单" sheetId="1" r:id="rId1"/></sheets></workbook>';

  const WORKBOOK_RELS =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>';

  const STYLES =
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<fonts count="2">' +
    '<font><sz val="11"/><name val="Calibri"/><family val="2"/></font>' +
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font>' +
    '</fonts>' +
    '<fills count="3">' +
    '<fill><patternFill patternType="none"/></fill>' +
    '<fill><patternFill patternType="gray125"/></fill>' +
    '<fill><patternFill patternType="solid"><fgColor rgb="FF0E9F6E"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="3">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="2" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>' +
    '</cellXfs>' +
    '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>' +
    '</styleSheet>';

  function sheetXml(headers, rows) {
    const numericCols = {};
    ['金额', '退款', '优惠', '报销金额'].forEach((name) => {
      const idx = headers.indexOf(name);
      if (idx >= 0) numericCols[idx] = true;
    });

    const widths = headers.map((h, i) => {
      let max = String(h).length * 2;
      rows.slice(0, 300).forEach((row) => {
        const v = row[i];
        if (v != null) max = Math.max(max, String(v).length);
      });
      return Math.max(10, Math.min(40, max + 2));
    });

    let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<dimension ref="A1:' + colLetter(headers.length - 1) + (rows.length + 1) + '"/>' +
      '<sheetViews><sheetView tabSelected="1" workbookViewId="0">' +
      '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +
      '</sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="16"/>' +
      '<cols>' + widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>' +
      '<sheetData>';

      headers.map((h, i) => cell(colLetter(i) + '1', h, 1)).join('') + '</row>';

    rows.forEach((row, r) => {
      const rowNumber = r + 2;
      let rowXml = '<row r="' + rowNumber + '">';

      for (let i = 0; i < headers.length; i++) {
        const value = row[i];

        rowXml += cell(colLetter(i) + rowNumber, value, numericCols[i] ? 2 : 0);
      }
      rowXml += '</row>';
      if (hasValue) xml += rowXml;

    xml += '</sheetData><autoFilter ref="A1:' + colLetter(headers.length - 1) + '1"/></worksheet>';
    return xml;
  }

  function buildWorkbook(headers, rows, sheetName) {

    const sheet = sheetXml(headers, rows || []);
    const files = [
      { name: '[Content_Types].xml', data: encoder.encode(CONTENT_TYPES) },
      { name: '_rels/.rels', data: encoder.encode(ROOT_RELS) },
      { name: 'xl/workbook.xml', data: encoder.encode(WORKBOOK) },
      { name: 'xl/_rels/workbook.xml.rels', data: encoder.encode(WORKBOOK_RELS) },
      { name: 'xl/styles.xml', data: encoder.encode(STYLES) },
      { name: 'xl/worksheets/sheet1.xml', data: encoder.encode(sheet) }
    ];
    return zipStore(files);
  }

  /* ------------------------------------------------------------------ *
   * 解压 / 解析
   * ------------------------------------------------------------------ */

  function u16(view, offset) { return view.getUint16(offset, true); }
  function u32(view, offset) { return view.getUint32(offset, true); }

  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('当前浏览器不支持解压 Excel，请使用新版 Chrome / WebView');
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function unzip(buffer) {
    const bytes = new Uint8Array(buffer);
    const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocd = -1;
    const min = Math.max(0, bytes.length - 65557);
    for (let i = bytes.length - 22; i >= min; i--) {
      if (view.getUint32(i, true) === 0x06054B50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('不是有效的 xlsx / zip 文件');
    const count = u16(view, eocd + 10);
    const centralOffset = u32(view, eocd + 16);
    const files = {};
    let pos = centralOffset;
    for (let i = 0; i < count; i++) {
      if (u32(view, pos) !== 0x02014B50) throw new Error('xlsx 目录损坏');
      const method = u16(view, pos + 10);
      const compSize = u32(view, pos + 20);
      const nameLen = u16(view, pos + 28);
      const extraLen = u16(view, pos + 30);
      const commentLen = u16(view, pos + 32);
      const localOffset = u32(view, pos + 42);
      const name = new TextDecoder('utf-8').decode(bytes.subarray(pos + 46, pos + 46 + nameLen));
      const localNameLen = u16(view, localOffset + 26);
      const localExtraLen = u16(view, localOffset + 28);
      const dataStart = localOffset + 30 + localNameLen + localExtraLen;
      const raw = bytes.subarray(dataStart, dataStart + compSize);
      files[name] = { method: method, data: raw };
      pos += 46 + nameLen + extraLen + commentLen;
    }
    const out = {};
    for (const name of Object.keys(files)) {
      const entry = files[name];
      if (entry.method === 0) out[name] = entry.data;
      else if (entry.method === 8) out[name] = await inflateRaw(entry.data);
      else throw new Error('不支持的压缩方式: ' + entry.method);
    }
    return out;
  }

  function parseXml(text) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'application/xml');
    const err = doc.getElementsByTagName('parsererror');
    if (err && err.length) throw new Error('xlsx 中的 XML 解析失败');
    return doc;
  }

  function textOf(node) {
    if (!node) return '';
    const parts = node.getElementsByTagName('t');
    let out = '';
    for (let i = 0; i < parts.length; i++) out += parts[i].textContent || '';
    return out;
  }

  function colIndex(ref) {
    const m = /^([A-Z]+)/.exec(String(ref || ''));
    if (!m) return 0;
    let n = 0;
    for (let i = 0; i < m[1].length; i++) n = n * 26 + (m[1].charCodeAt(i) - 64);
    return n - 1;
  }

  function excelDate(serial) {
    const whole = Math.floor(serial);
    const frac = serial - whole;
    const ms = Math.round((whole - 25569) * 86400000 + Math.round(frac * 86400) * 1000);
    const d = new Date(ms);
    if (isNaN(d.getTime())) return null;
    return d.getUTCFullYear() + '-' +
      String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
      String(d.getUTCDate()).padStart(2, '0');
  }

  async function parseWorkbook(buffer) {
    const files = await unzip(buffer);
    const shared = {};
    if (files['xl/sharedStrings.xml']) {
      const doc = parseXml(new TextDecoder('utf-8').decode(files['xl/sharedStrings.xml']));
      const items = doc.getElementsByTagName('si');
      for (let i = 0; i < items.length; i++) shared[i] = textOf(items[i]);
    }

    let sheetPath = 'xl/worksheets/sheet1.xml';
    if (!files[sheetPath]) {
      sheetPath = Object.keys(files).find((n) => /^xl\/worksheets\/.*\.xml$/.test(n)) || '';
    }
    if (!sheetPath || !files[sheetPath]) throw new Error('xlsx 中没有工作表');

    const doc = parseXml(new TextDecoder('utf-8').decode(files[sheetPath]));
    const rowNodes = doc.getElementsByTagName('row');
    const rows = [];
    for (let r = 0; r < rowNodes.length; r++) {
      const cells = rowNodes[r].getElementsByTagName('c');
      const row = [];
      for (let c = 0; c < cells.length; c++) {
        const cell = cells[c];
        const ref = cell.getAttribute('r');
        const idx = ref ? colIndex(ref) : c;
        const type = cell.getAttribute('t') || '';
        let value = '';
        if (type === 'inlineStr') {
          value = textOf(cell);
        } else {
          const v = cell.getElementsByTagName('v')[0];
          if (v) {
            if (type === 's') value = shared[Number(v.textContent)] || '';
            else if (type === 'b') value = v.textContent === '1' ? 'TRUE' : 'FALSE';
            else if (type === 'str') value = v.textContent;
            else {
              const num = Number(v.textContent);
              value = isFinite(num) ? num : v.textContent;
            }
          }
        }
        row[idx] = value;
      }
      if (row.some((v) => v !== '' && v != null)) rows.push(row);
    }

    const headers = (rows.shift() || []).map((v) => String(v || '').trim());
    const dateIdx = headers.indexOf('日期');
    if (dateIdx >= 0) {
      rows.forEach((row) => {
        const v = row[dateIdx];
        if (typeof v === 'number' && v > 0) {
          const iso = excelDate(v);
          if (iso) row[dateIdx] = iso;
        }
      });
    }
    return { headers: headers, rows: rows };
  }

  return { buildWorkbook, parseWorkbook, zipStore, crc32 };
});

  function resolveTheme() {
    const setting = state.data.settings.theme;

    if (THEMES.some((t) => t.id === setting)) return setting;

    const theme = resolveTheme();

      const img = state.data && state.data.settings && state.data.settings.customThemeImage;

  function confirmDialog(opts) {

      const backdrop = document.createElement('div');

      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) done(false); });
      backdrop.querySelector('[data-no]').addEventListener('click', () => done(false));
      backdrop.querySelector('[data-yes]').addEventListener('click', () => done(true));

  }

  function download(filename, content, mime) {
    try {
      let blob;
      if (content instanceof Blob) blob = content;
      else if (content instanceof Uint8Array) blob = new Blob([content], { type: mime || 'application/octet-stream' });
      else blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });

      // Android WebView 壳：通过 SAF 保存文件
      if (window.AndroidBridge && window.AndroidBridge.saveFile) {
        const reader = new FileReader();
        reader.onload = function () {
          const raw = String(reader.result || '');
          const comma = raw.indexOf(',');
          const cleanMime = (mime || 'application/octet-stream').split(';')[0];
          window.AndroidBridge.saveFile(filename, comma >= 0 ? raw.slice(comma + 1) : raw, cleanMime);
        };
        reader.readAsDataURL(blob);
        return true;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      window.setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
      return true;
    } catch (err) {
      toast('导出失败：' + err.message, 'error');
      return false;
    }
  }

  /* ------------------------------------------------------------------ *

  function statsCarouselHTML() {
    const modes = ['daily', 'month', 'year', 'custom'];
    const index = Math.max(0, modes.indexOf(state.statsMode));
    return '<div class="stats-carousel" data-stats-carousel>' +
      '<div class="stats-track" data-stats-track style="transform:translate3d(-' + (index * 25) + '%,0,0)">' +
        modes.map((m) => '<div class="stats-pane" data-stats-pane="' + m + '">' + statsHTML(m, '-' + m) + '</div>').join('') +

  function statsCarouselHeight() {
    const carousel = document.querySelector('[data-stats-carousel]');
    if (!carousel) return;
    const active = carousel.querySelector('[data-stats-pane="' + state.statsMode + '"]');
    if (active) carousel.style.height = active.offsetHeight + 'px';
  }

  function mountStatsCarousel() {
    ['daily', 'month', 'year', 'custom'].forEach((m) => mountStatsCharts(m, '-' + m));
    wireStatsSwipe();
    window.requestAnimationFrame(() => {
      statsCarouselHeight();
      window.setTimeout(statsCarouselHeight, 80);
    });
  }

  function remountStatsPanes() {
    if (state.route !== 'stats') return;
    ['daily', 'month', 'year', 'custom'].forEach((m) => mountStatsCharts(m, '-' + m));
    statsCarouselHeight();
  }

  function wireStatsSwipe() {
    const carousel = document.querySelector('[data-stats-carousel]');
    const track = carousel && carousel.querySelector('[data-stats-track]');
    if (!carousel || !track || carousel.dataset.swiped === '1') return;
    carousel.dataset.swiped = '1';
    const modes = ['daily', 'month', 'year', 'custom'];
    let index = Math.max(0, modes.indexOf(state.statsMode));
    let sx = null, sy = null, dx = 0, horizontal = false, animating = false;
    const width = () => carousel.clientWidth || 320;

    function apply(i, extra) {
      track.style.transform = 'translate3d(calc(-' + (i * 25) + '% + ' + (extra || 0) + 'px),0,0)';
    }
    function reset() {
      track.style.transition = 'transform .22s cubic-bezier(.22,.8,.28,1)';
      apply(index, 0);
      horizontal = false;
    }

    carousel.addEventListener('touchstart', (e) => {
      if (animating) return;
      if (e.target.closest('button, input, .month-rail, .stats-chart-controls, .stats-chart-type, .stats-tabs, .heat-year-grid, .sheet, .stats-table')) return;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; horizontal = false;
      track.style.transition = 'none';
    }, { passive: true });

    carousel.addEventListener('touchmove', (e) => {
      if (sx == null || animating) return;
      dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;
      if (Math.abs(dx) > 9 && Math.abs(dx) > Math.abs(dy)) {
        horizontal = true;
        if (e.cancelable) e.preventDefault();
      }
      if (!horizontal) return;
      const max = width() * 0.86;
      const clamped = Math.max(-max, Math.min(max, dx));
      apply(index, clamped);
    }, { passive: false });

    carousel.addEventListener('touchend', () => {
      if (sx == null) return;
      const threshold = Math.min(72, width() * 0.18);
      const target = dx < 0 ? Math.min(modes.length - 1, index + 1) : Math.max(0, index - 1);
      const should = horizontal && Math.abs(dx) > threshold && target !== index;
      sx = null; sy = null;
      if (!should) {
        if (target !== index) { reset(); return; }
        reset(); return;
      }
      animating = true;
      state.suppressClickUntil = Date.now() + 450;
      track.style.transition = 'transform .24s cubic-bezier(.22,.8,.28,1)';
      apply(target, 0);
      window.setTimeout(() => {
        animating = false;
        index = target;
        state.statsMode = modes[target];
        renderAppbar();
        statsCarouselHeight();
        window.scrollTo(0, 0);
      }, 245);
      horizontal = false;
    }, { passive: true });
  }

  function renderView() {
    if (state.route === 'home') viewEl.innerHTML = homeHTML();
    else if (state.route === 'calendar') { viewEl.innerHTML = calendarHTML(); wireCalendarSwipe(); }
    else if (state.route === 'stats') { viewEl.innerHTML = statsCarouselHTML(); statsCarouselHeight(); mountStatsCarousel(); }
    else if (state.route === 'assets') viewEl.innerHTML = assetsHTML();
    else viewEl.innerHTML = profileHTML();
  }

  function render() {
    document.body.dataset.route = state.route;
    renderAppbar();
    renderTabbar();
    renderView();
  }

  function go(route, dir) {
    if (!route || route === state.route) {
      window.scrollTo(0, 0);
      return;
    }
    let ghost = null;
    if (dir && viewEl.innerHTML) {
      try {
        const rect = viewEl.getBoundingClientRect();
        ghost = document.createElement('div');
        ghost.className = 'page-ghost ' + (dir > 0 ? 'to-left' : 'to-right');
        ghost.style.top = Math.max(0, rect.top) + 'px';
        ghost.style.height = 'calc(100vh - ' + Math.max(0, rect.top) + 'px)';
        const clone = viewEl.cloneNode(true);
        clone.removeAttribute('id');
        clone.style.transform = 'translateY(' + (-window.scrollY) + 'px)';
        ghost.appendChild(clone);
        document.body.appendChild(ghost);
      } catch (err) { ghost = null; }
    }
    state.selectMode = false;
    state.selectedIds = [];
    state.route = route;
    render();
    window.scrollTo(0, 0);
    if (dir) {
      viewEl.classList.remove('page-slide-next', 'page-slide-prev');
      void viewEl.offsetWidth;
      viewEl.classList.add(dir > 0 ? 'page-slide-next' : 'page-slide-prev');
      window.setTimeout(() => viewEl.classList.remove('page-slide-next', 'page-slide-prev'), 330);
      if (ghost) window.setTimeout(() => ghost.remove(), 340);
    } else if (ghost) {
      ghost.remove();
    }
  }

  function groupByDay(list) {
    const groups = [];
    let cur = null;
    list.forEach((t) => {
      if (!cur || cur.date !== t.date) {
        cur = { date: t.date, items: [], expense: 0, income: 0 };
        groups.push(cur);
      }
      cur.items.push(t);
      if (t.type === 'expense') cur.expense += C.toCents(t.amount);
      if (t.type === 'income') cur.income += C.toCents(t.amount);
    });
    groups.forEach((g) => {
      g.expense = C.fromCents(g.expense);
      g.income = C.fromCents(g.income);
    });
    return groups;
  }

  function txRowHTML(t, opts) {
    const cm = C.categoryMap(state.data);
    const am = C.accountMap(state.data);
    const o = opts || {};
    const isTransfer = t.type === 'transfer';
    const cat = cm[t.categoryId] || { name: '未分类', icon: '🏷️', color: '#94a3b8' };
    const acc = am[t.accountId];
    const to = am[t.toAccountId];
    const catLabel = isTransfer ? '转账' : (cat.name + (t.subcategory ? ' · ' + t.subcategory : ''));
    let tag = t.tags && t.tags[0] ? '<span class="tx-tag">' + esc(t.tags[0]) + '</span>' : '';
    if (t.attachments && t.attachments.length) {
      tag += '<span class="tx-tag">📎' + t.attachments.length + '</span>';
    }
    if (t.reimburseAmount > 0) tag += '<span class="tx-tag">报销</span>';
    const selecting = !!state.selectMode;
    const selected = selecting && state.selectedIds.indexOf(t.id) >= 0;
    const bits = [];
    if (o.showDate) bits.push(esc(C.dateLabel(t.date)));
    bits.push('<span class="tx-time">' + esc(t.time || '12:00') + '</span>');
    if (t.note) bits.push(esc(t.note));
    if (t.currency) bits.push(esc(t.currency + (t.foreignAmount ? ' ' + C.money(t.foreignAmount) : '')));
    if (isTransfer) bits.push(esc((acc ? acc.name : '?') + ' → ' + (to ? to.name : '?')));
    else if (acc) bits.push(esc(acc.name));
    if (o.showBook) {
      const book = state.data.books.find((b) => b.id === t.bookId);
      if (book) bits.push(esc(book.name));
    }
    const sign = t.type === 'expense' ? '-' : t.type === 'income' ? '+' : '';
    return '<button class="tx' + (selected ? ' selected' : '') + '" data-act="edit-tx" data-id="' + t.id + '">' +
      (selecting ? '<span class="tx-check"></span>' : '') +
      '<span class="tx-icon" style="background:' + alpha(isTransfer ? '#64748b' : cat.color, 0.13) + '">' +
        (isTransfer ? '🔁' : cat.icon) + '</span>' +
      '<span class="tx-main">' +
        '<span class="tx-cat"><span class="tx-cat-text">' + esc(catLabel) + '</span>' + tag + '</span>' +
        '<span class="tx-note">' + (bits.join(' · ') || '&nbsp;') + '</span>' +
      '</span>' +
      '<span class="tx-amount ' + t.type + '">' + (sign ? sign + '¥' : '¥') + C.money(t.amount) + '</span>' +
    '</button>';
