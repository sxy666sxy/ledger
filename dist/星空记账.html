/* ==========================================================================
   星空记账 · 样式
   移动优先，浅色/深色双主题
   ========================================================================== */

:root {
  --bg: #f3f5ff;
  --surface: #ffffff;
  --surface-2: #f7f8ff;
  --surface-3: #edf0ff;
  --text: #151a33;
  --text-2: #5c6684;
  --text-3: #929bb5;
  --line: rgba(21, 26, 51, 0.07);
  --line-strong: rgba(21, 26, 51, 0.13);
  --primary: #5b6cff;
  --primary-dark: #4052e8;
  --primary-soft: #eef0ff;
  --danger: #e5484d;
  --danger-soft: #fdeceb;
  --warning: #e0a325;
  --income: #0e9f6e;
  --shadow-sm: 0 1px 2px rgba(36, 45, 100, 0.04), 0 6px 20px rgba(36, 45, 100, 0.06);
  --shadow-lg: 0 18px 60px rgba(24, 30, 80, 0.18);
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-nav: rgba(255, 255, 255, 0.87);
  --glass-border: rgba(255, 255, 255, 0.58);
  --glass-shadow: 0 14px 40px rgba(30, 40, 100, 0.14);
  --theme-bg: radial-gradient(80% 55% at 12% 0%, rgba(91, 108, 255, 0.10), transparent 60%), radial-gradient(70% 45% at 92% 8%, rgba(155, 120, 255, 0.09), transparent 60%), var(--bg);
  --hero-bg: radial-gradient(1px 1px at 14% 28%, rgba(255,255,255,.9), transparent 1.6px), radial-gradient(1.2px 1.2px at 72% 18%, rgba(255,255,255,.8), transparent 1.8px), radial-gradient(1px 1px at 84% 64%, rgba(255,255,255,.55), transparent 1.5px), radial-gradient(1px 1px at 38% 82%, rgba(255,255,255,.6), transparent 1.5px), radial-gradient(120% 120% at 100% 0%, rgba(139, 156, 255, .35) 0%, rgba(139, 156, 255, 0) 52%), radial-gradient(90% 90% at 0% 100%, rgba(86, 48, 160, .35) 0%, rgba(86, 48, 160, 0) 58%), linear-gradient(128deg, #1a2355 0%, #0a0f2a 55%, #211747 100%);
  --hero-shadow: 0 14px 36px -12px rgba(40, 55, 160, .65);
  --fab-bg: linear-gradient(145deg, #8494ff, #4a5bdb);
  --fab-shadow: 0 10px 26px rgba(74, 91, 219, .45), inset 0 1px 0 rgba(255,255,255,.35);
  --radius: 20px;
  --radius-sm: 14px;
  --tab-h: 62px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #070a17;
  --surface: #10152b;
  --surface-2: #141b34;
  --surface-3: #1b2342;
  --text: #eef2ff;
  --text-2: #a6b0d0;
  --text-3: #7480a2;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);
  --primary: #8b9cff;
  --primary-dark: #6f82ff;
  --primary-soft: rgba(139, 156, 255, 0.14);
  --danger: #ff7b72;
  --danger-soft: rgba(255, 123, 114, 0.13);
  --income: #2dd4a0;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.55);
  --glass-bg: rgba(16, 21, 43, 0.74);
  --glass-nav: rgba(16, 21, 43, 0.86);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-shadow: 0 16px 44px rgba(0, 0, 0, 0.4);
  --theme-bg: radial-gradient(70% 45% at 18% 0%, rgba(139, 156, 255, 0.13), transparent 60%), radial-gradient(55% 40% at 92% 8%, rgba(155, 120, 255, 0.10), transparent 60%), var(--bg);
  --hero-bg: radial-gradient(1px 1px at 14% 28%, rgba(255,255,255,.9), transparent 1.6px), radial-gradient(1.2px 1.2px at 72% 18%, rgba(255,255,255,.8), transparent 1.8px), radial-gradient(1px 1px at 84% 64%, rgba(255,255,255,.55), transparent 1.5px), radial-gradient(1px 1px at 38% 82%, rgba(255,255,255,.6), transparent 1.5px), radial-gradient(120% 120% at 100% 0%, rgba(139, 156, 255, .26) 0%, rgba(139, 156, 255, 0) 52%), radial-gradient(90% 90% at 0% 100%, rgba(86, 48, 160, .32) 0%, rgba(86, 48, 160, 0) 58%), linear-gradient(128deg, #111a40 0%, #060916 55%, #17112f 100%);
  --hero-shadow: 0 14px 36px -12px rgba(0, 0, 0, .7);
  --fab-bg: linear-gradient(145deg, #8494ff, #4a5bdb);
  --fab-shadow: 0 10px 26px rgba(74, 91, 219, .5), inset 0 1px 0 rgba(255,255,255,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--theme-bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Source Han Sans SC", system-ui, "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}

body { min-height: 100dvh; }
body.no-scroll { overflow: hidden; }

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}
button { border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea, select { outline: none; }
a { color: var(--primary); text-decoration: none; }

.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.muted { color: var(--text-2); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.hidden { display: none !important; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }
.center { text-align: center; }

/* ---------------------------------------------------------------- shell */

#app {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
  background: var(--theme-bg);
}

.appbar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: calc(var(--safe-t) + 4px) 14px 2px;
  background: var(--glass-bg);
  backdrop-filter: blur(22px) saturate(1.8);
  -webkit-backdrop-filter: blur(22px) saturate(1.8);
  border-bottom: 1px solid var(--glass-border);
  box-shadow: 0 4px 24px rgba(10, 35, 24, 0.05);
}
.appbar[hidden] { display: none; }

.appbar-inner {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
}

.book-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  padding: 0 11px 0 9px;
  border-radius: 12px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  font-size: 15px;
  font-weight: 650;
  letter-spacing: .2px;
  max-width: 58%;
}
.book-chip .chev { color: var(--text-3); font-size: 10px; margin-top: 1px; }
.book-chip .emoji { font-size: 16px; }

.appbar-title {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .2px;
}
.appbar-title small {
  display: block;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: .4px;
  margin-top: -2px;
}

.appbar-actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-2);
  transition: background .18s, transform .12s;
}
.icon-btn:active { background: var(--surface-3); transform: scale(.94); }
.icon-btn svg { width: 21px; height: 21px; }
.icon-btn.small svg { width: 18px; height: 18px; }

.view {
  padding: 0 14px calc(var(--tab-h) + var(--safe-b) + 48px);
}
@keyframes viewIn {
  from { transform: translateY(7px); }
  to { transform: none; }
}

/* ---------------------------------------------------------------- tabbar */

.tabbar {
  position: fixed;
  left: 50%;
  bottom: calc(-4px + var(--safe-b));
  transform: translateX(-50%);
  width: min(calc(100% - 24px), 520px);
  height: 62px;
  padding: 0 6px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  border-radius: 28px;
  background: var(--glass-nav);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, .45);
  z-index: 60;
}
.fab-add {
  position: absolute;
  right: 8px;
  bottom: calc(100% + 14px);
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--fab-bg);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--fab-shadow);
  z-index: 65;
  transition: transform .15s ease;
}
.fab-add:active { transform: scale(.92); }
.liquid {
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, .45);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .appbar, .tabbar, .liquid { background: var(--surface); }
}
.tab {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 10.5px;
  color: var(--text-3);
  transition: color .18s;
}
.tab svg { width: 23px; height: 23px; }
.tab.active { color: var(--primary); font-weight: 600; }
.tab-fab {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  margin: -18px auto 0;
  background: var(--fab-bg);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 22px rgba(74, 91, 219, .38), 0 2px 4px rgba(0, 0, 0, .08);
  transition: transform .15s ease;
}
.tab-fab:active { transform: scale(.92); }
.tab-fab svg { width: 27px; height: 27px; }

/* ---------------------------------------------------------------- hero */

.hero {
  position: relative;
  margin: 6px 0 18px;
  padding: 20px 20px 18px;
  border-radius: 26px;
  color: #fff;
  overflow: hidden;
  background: var(--hero-bg);
  box-shadow: var(--hero-shadow);
}
.hero::after {
  content: "";
  position: absolute;
  right: -46px;
  top: -58px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .16);
  box-shadow: inset 0 0 0 26px rgba(255, 255, 255, .035);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero-label {
  font-size: 12.5px;
  letter-spacing: 1.6px;
  color: rgba(255, 255, 255, .8);
  font-weight: 500;
}
.hero-nav {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: rgba(255, 255, 255, .14);
  border-radius: 999px;
  padding: 2px;
}
.hero-nav button {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  color: rgba(255, 255, 255, .92);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  line-height: 1;
}
.hero-nav button:active { background: rgba(255, 255, 255, .18); }
.hero-nav .m {
  font-size: 12.5px;
  font-weight: 600;
  padding: 0 4px;
  min-width: 74px;
  text-align: center;
  letter-spacing: .2px;
}

.hero-amount {
  display: flex;
  align-items: baseline;
  gap: 3px;
  margin: 12px 0 4px;
  font-size: clamp(30px, 10.4vw, 42px);
  font-weight: 750;
  letter-spacing: -1.2px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.hero-amount .cur { font-size: 20px; font-weight: 600; opacity: .82; letter-spacing: 0; }
.hero-amount .dec { font-size: 24px; font-weight: 650; opacity: .9; letter-spacing: -.5px; }
.hero-amount.negative { color: #ffe3df; }

.hero-meta {
  display: flex;
  gap: 22px;
  margin-top: 10px;
  position: relative;
  z-index: 1;
}
.hero-meta-item span {
  display: block;
  font-size: 11px;
  color: rgba(255, 255, 255, .68);
  letter-spacing: .6px;
}
.hero-meta-item b {
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: .2px;
  font-variant-numeric: tabular-nums;
}

.hero-budget {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid rgba(255, 255, 255, .14);
  position: relative;
  z-index: 1;
}
.hero-budget-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  color: rgba(255, 255, 255, .8);
  margin-bottom: 7px;
  gap: 8px;
}
.hero-budget-head b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
.budget-track {
  height: 5px;
  border-radius: 99px;
  background: rgba(255, 255, 255, .2);
  overflow: hidden;
}
.budget-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #c7d0ff, #ffffff);
  transition: width .5s ease;
}
.budget-fill.warn { background: linear-gradient(90deg, #ffe082, #ffc94d); }
.budget-fill.over { background: linear-gradient(90deg, #ffb4a8, #ff7a6b); }
.hero-budget-hint {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: rgba(255, 255, 255, .78);
  width: 100%;
}
.hero-budget-hint b { color: #fff; }
.hero-budget .go { color: #fff; font-weight: 600; }

/* ---------------------------------------------------------------- list */

.month-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 2px 2px 10px;
  color: var(--text-2);
  font-size: 13px;
}
.month-bar .m { font-weight: 600; color: var(--text); font-size: 13.5px; }
.chip-back {
  margin-left: auto;
  font-size: 12px;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 4px 9px;
  border-radius: 99px;
  font-weight: 600;
}

.day { margin-bottom: 14px; }
.day-head {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 2px 4px 7px;
  color: var(--text-3);
  font-size: 11.5px;
}
.day-date {
  font-size: 17px;
  font-weight: 750;
  color: var(--text);
  letter-spacing: -.4px;
  font-variant-numeric: tabular-nums;
}
.day-week { letter-spacing: .4px; }
.day-total { margin-left: auto; text-align: right; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.day-total b { color: var(--text-2); font-weight: 600; }

.tx-list {
  background: var(--surface);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.tx {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 13px;
  position: relative;
  transition: background .15s;
  width: 100%;
  text-align: left;
  color: inherit;
  font: inherit;
}
.tx + .tx::before {
  content: "";
  position: absolute;
  top: 0;
  left: 52px;
  right: 0;
  height: 1px;
  background: var(--line);
}
.tx:active { background: var(--surface-2); }
.tx-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex: none;
  background: var(--surface-3);
}
.tx-main { flex: 1; min-width: 0; display: block; }
.tx-cat {
  font-size: 14.5px;
  font-weight: 450;
  letter-spacing: .1px;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.tx-cat-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.tx-tag {
  font-size: 10px;
  font-weight: 400;

}
.tx-note {
  display: block;
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tx-amount {
  font-size: 15.5px;
  font-weight: 650;
  letter-spacing: -.2px;
  color: var(--text);

  flex: none;
}
.tx-amount.income { color: var(--income); }
.tx-amount.expense { color: var(--danger); }
.tx-amount.transfer { color: var(--text-2); }

.empty {
  text-align: center;
  padding: 54px 26px 42px;
  color: var(--text-3);
}
.empty-emoji { font-size: 52px; line-height: 1; filter: grayscale(.1); }
.empty-title { margin: 14px 0 5px; font-size: 15.5px; color: var(--text-2); font-weight: 600; }
.empty-text { font-size: 12.5px; line-height: 1.7; }

.inline-add {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  margin-top: 14px;
  height: 44px;
  border-radius: 14px;
  border: 1.5px dashed var(--line-strong);
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 550;
}

/* ---------------------------------------------------------------- cards & stats */

.section { margin: 18px 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 3px 9px; }
.section-title { font-size: 13.5px; font-weight: 650; letter-spacing: .3px; }
.section-link { font-size: 12px; color: var(--text-3); }

.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 12px; }
.card-title {
  font-size: 13.5px;
  font-weight: 650;
  letter-spacing: .2px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.card-title span { color: var(--text-3); font-weight: 500; font-size: 11.5px; }

.seg {
  display: flex;
  background: var(--surface-3);
  border-radius: 12px;
  padding: 3px;
  gap: 2px;
}
.seg-btn {
  flex: 1;
  height: 32px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 550;
  color: var(--text-2);
  transition: all .18s;
}
.seg-btn.active {
  background: var(--surface);
  color: var(--text);
  font-weight: 650;
  box-shadow: 0 1px 4px rgba(10, 30, 20, .1);
}

.month-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 14px 0 12px;
}
.month-strip button {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.month-strip .m { font-weight: 700; font-size: 16px; letter-spacing: .2px; min-width: 110px; text-align: center; }
.month-strip .m small { display: block; font-size: 10.5px; color: var(--text-3); font-weight: 500; margin-top: 1px; }

.big-amount { font-size: 34px; font-weight: 750; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.big-amount .cur { font-size: 18px; opacity: .6; margin-right: 2px; font-weight: 600; }
.big-amount .dec { font-size: 19px; opacity: .75; }

.donut-card { padding: 18px 16px 12px; }
.donut-box {
  position: relative;
  width: 176px;
  height: 176px;
  margin: 2px auto 14px;
}
.donut-svg { position: absolute; inset: 0; }
.donut-svg svg { display: block; width: 100%; height: 100%; }
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  text-align: center;
}
.donut-center .t { font-size: 10.5px; color: var(--text-3); letter-spacing: 1px; }
.donut-center .v { font-size: 22px; font-weight: 750; letter-spacing: -.6px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.donut-center .s { font-size: 10.5px; color: var(--text-3); margin-top: 2px; }

.legend { display: flex; flex-direction: column; gap: 2px; }
.legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 2px;
  border-radius: 8px;
}
.legend-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.legend-name { font-size: 13px; font-weight: 550; min-width: 52px; }
.legend-bar { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.legend-bar i { display: block; height: 100%; border-radius: 99px; }
.legend-pct { font-size: 10.5px; color: var(--text-3); width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.legend-amount { font-size: 12.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; min-width: 68px; }

.chart-bars { width: 100%; height: 152px; display: block; }
.chart-line { width: 100%; height: 120px; display: block; margin-top: 4px; }
.chart-bars svg, .chart-line svg { display: block; width: 100%; height: 100%; }

.rank-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
}
.rank-row + .rank-row { border-top: 1px solid var(--line); }
.rank-idx {
  width: 18px;
  font-size: 11px;
  color: var(--text-3);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.rank-idx.top { color: var(--primary); }
.rank-name { font-size: 13.5px; font-weight: 550; }
.rank-sub { font-size: 10.5px; color: var(--text-3); margin-top: 1px; }
.rank-amt { margin-left: auto; font-size: 13.5px; font-weight: 650; font-variant-numeric: tabular-nums; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.stat-cell {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  box-shadow: var(--shadow-sm);
}
.stat-cell .k { font-size: 10.5px; color: var(--text-3); letter-spacing: .4px; }
.stat-cell .v { font-size: 20px; font-weight: 700; margin-top: 3px; letter-spacing: -.4px; font-variant-numeric: tabular-nums; }
.stat-cell .v small { font-size: 11px; font-weight: 500; color: var(--text-3); margin-left: 2px; }

/* ---------------------------------------------------------------- assets */

.asset-hero {
  position: relative;
  margin: 6px 0 16px;
  padding: 22px 20px;
  border-radius: 24px;
  overflow: hidden;
  color: #fff;
  background: var(--hero-bg);
  box-shadow: var(--hero-shadow);
}
.asset-hero > * { position: relative; z-index: 1; }
.asset-hero .k { font-size: 11.5px; color: rgba(255, 255, 255, .55); letter-spacing: 2px; }
.asset-hero .big { font-size: 38px; font-weight: 750; letter-spacing: -1px; margin: 6px 0 14px; font-variant-numeric: tabular-nums; }
.asset-hero .big .cur { font-size: 18px; opacity: .55; margin-right: 3px; }
.asset-hero .big .dec { font-size: 20px; opacity: .7; }
.asset-break { display: flex; gap: 26px; }
.asset-break div span { display: block; font-size: 10.5px; color: rgba(255, 255, 255, .5); margin-bottom: 2px; }
.asset-break div b { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

.acct-group { margin: 16px 0; }
.acct-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 4px 8px;
  font-size: 12px;
  color: var(--text-3);
  letter-spacing: .6px;
}
.acct-head button { color: var(--primary); font-size: 12px; font-weight: 600; }
.acct-list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.acct-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  position: relative;
  width: 100%;
  text-align: left;
}
.acct-row + .acct-row::before {
  content: "";
  position: absolute;
  top: 0;
  left: 58px;
  right: 0;
  height: 1px;
  background: var(--line);
}
.acct-row:active { background: var(--surface-2); }
.acct-icon {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex: none;
}
.acct-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.acct-type { font-size: 10px; color: var(--text-3); font-weight: 500; border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }
.acct-sub { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
.acct-balance { margin-left: auto; text-align: right; font-size: 15.5px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.2px; }
.acct-balance.neg { color: var(--danger); }
.acct-balance small { display: block; font-size: 10px; color: var(--text-3); font-weight: 500; margin-top: 1px; }

.action-row { display: flex; gap: 10px; margin: 16px 0 4px; }
.action-btn {
  flex: 1;
  height: 48px;
  border-radius: 15px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
}
.action-btn.primary { background: var(--primary); color: #fff; box-shadow: 0 8px 22px -8px rgba(74, 91, 219, .6); }
.action-btn svg { width: 18px; height: 18px; }

/* ---------------------------------------------------------------- profile */

.profile-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 4px 18px;
}
.avatar {
  width: 54px;
  height: 54px;
  border-radius: 18px;
  background: linear-gradient(145deg, #e3e7ff, #c9d1ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex: none;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5);
}
[data-theme="dark"] .avatar { background: linear-gradient(145deg, #232b5a, #161c3a); }
.profile-name { font-size: 17px; font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 7px; }
.profile-name .badge {
  font-size: 9.5px;
  font-weight: 600;
  color: var(--primary);
  background: var(--primary-soft);
  border-radius: 5px;
  padding: 2px 5px;
  letter-spacing: .3px;
}
.profile-sub { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }

.stat-strip {
  display: flex;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 14px 0;
  margin-bottom: 18px;
}
.stat-strip div { flex: 1; text-align: center; position: relative; }
.stat-strip div + div::before {
  content: "";
  position: absolute;
  left: 0;
  top: 15%;
  height: 70%;
  width: 1px;
  background: var(--line);
}
.stat-strip b { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
.stat-strip span { font-size: 10.5px; color: var(--text-3); }

.menu-group { margin-bottom: 16px; }
.menu-group-title { font-size: 11.5px; color: var(--text-3); margin: 0 4px 7px; letter-spacing: .8px; }
.menu {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.menu-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 13px 14px;
  position: relative;
  text-align: left;
}
.menu-row + .menu-row::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50px;
  right: 0;
  height: 1px;
  background: var(--line);
}
.menu-row:active { background: var(--surface-2); }
.menu-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: var(--surface-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex: none;
}
.menu-label { font-size: 14px; font-weight: 500; }
.menu-value { margin-left: auto; font-size: 12.5px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
.menu-row.danger .menu-label { color: var(--danger); }
.chev { color: var(--text-3); font-size: 16px; line-height: 1; opacity: .7; }

.about-note { text-align: center; font-size: 11px; color: var(--text-3); margin: 22px 0 8px; line-height: 1.8; }

/* ---------------------------------------------------------------- sheet */

.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(8, 18, 13, .42);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
@keyframes fadeIn { from { opacity: .55; } to { opacity: 1; } }

.sheet {
  width: 100%;
  max-width: 560px;
  max-height: 90dvh;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  padding-bottom: var(--safe-b);
  display: flex;
  flex-direction: column;
  box-shadow: 0 -12px 50px rgba(0, 0, 0, .18);
  overflow: hidden;
}
@keyframes sheetUp {
  from { transform: translateY(64px); }
  to { transform: translateY(0); }
}
.sheet-grab {
  width: 38px;
  height: 4px;
  border-radius: 99px;
  background: var(--line-strong);
  margin: 8px auto 0;
  flex: none;
}
.sheet-head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 18px 10px;
  flex: none;
}
.sheet-title { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
.sheet-sub { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.sheet-head .icon-btn { margin-left: auto; width: 32px; height: 32px; }
.sheet-body {
  flex: 1;
  min-height: 0;
  padding: 2px 18px 18px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.sheet-body.flush { padding: 0; }
.sheet-actions { display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid var(--line); background: var(--surface); }

.btn {
  height: 46px;
  border-radius: 14px;
  padding: 0 18px;
  font-size: 14.5px;
  font-weight: 600;
  background: var(--surface-3);
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform .12s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.ghost { background: transparent; color: var(--text-2); border: 1px solid var(--line-strong); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }

/* ---------------------------------------------------------------- forms */

.field { margin-bottom: 14px; }
.field-label { font-size: 11.5px; color: var(--text-3); margin: 0 2px 6px; letter-spacing: .4px; display: flex; justify-content: space-between; }
.input, .textarea, .select {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 12px 13px;
  font-size: 14.5px;
  color: var(--text);
  transition: border-color .18s, background .18s;
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--primary); background: var(--surface); }
.textarea { resize: vertical; min-height: 76px; line-height: 1.6; }
.input-row { display: flex; gap: 10px; }
.input-row > * { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  height: 30px;
  padding: 0 11px;
  border-radius: 99px;
  background: var(--surface-2);
  font-size: 12px;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid transparent;
}
.chip.active { background: var(--primary-soft); color: var(--primary); border-color: transparent; font-weight: 600; }

.switch { position: relative; width: 44px; height: 26px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; }
.switch-track {
  position: absolute;
  inset: 0;
  border-radius: 99px;
  background: var(--surface-3);
  transition: background .2s;
  pointer-events: none;
}
.switch-track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
  transition: transform .2s;
}
.switch input:checked + .switch-track { background: var(--primary); }
.switch input:checked + .switch-track::after { transform: translateX(18px); }

.list-plain { margin: 0; padding: 0; list-style: none; }
.list-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 2px;
  border-bottom: 1px solid var(--line);
}
.list-item:last-child { border-bottom: 0; }
.list-item .ic {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  background: var(--surface-3);
  flex: none;
}
.list-item .t { font-size: 14px; font-weight: 550; }
.list-item .s { font-size: 11px; color: var(--text-3); margin-top: 1px; }
.list-item .r { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- entry sheet */

.sheet.entry { height: 92dvh; max-height: 92dvh; }
.entry-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface-3);
  padding: 3px;
  border-radius: 12px;
  margin: 0 18px 10px;
  flex: none;
}
.entry-tab {
  flex: 1;
  height: 32px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 550;
  color: var(--text-2);
}
.entry-tab.active { background: var(--surface); color: var(--text); font-weight: 650; box-shadow: 0 1px 4px rgba(0, 0, 0, .08); }
.entry-tab.active.income { color: var(--income); }
.entry-tab.active.transfer { color: #3b82f6; }

.entry-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

.cat-wrap {
  flex: 1;
  overflow-y: auto;
  min-height: 74px;
  padding: 2px 10px 10px;
  -webkit-overflow-scrolling: touch;
}
.cat-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 2px;
}
.cat-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 7px 0 5px;
  border-radius: 12px;
  transition: background .15s;
}
.cat-cell:active { background: var(--surface-2); }
.cat-ico {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  transition: transform .15s, box-shadow .15s;
}
.cat-cell.active .cat-ico {
  box-shadow: 0 0 0 2px var(--primary), 0 4px 12px -4px rgba(74, 91, 219, .5);
  transform: translateY(-1px);
}
.cat-name { font-size: 10.5px; color: var(--text-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.cat-cell.active .cat-name { color: var(--primary); font-weight: 650; }
.cat-cell.manage .cat-ico { background: var(--surface-2); color: var(--text-3); font-size: 17px; border: 1px dashed var(--line-strong); }

.transfer-panel { padding: 4px 18px 8px; flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.account-pick {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-2);
  border-radius: 14px;
  padding: 11px 13px;
  width: 100%;
  text-align: left;
}
.account-pick .ic { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; background: var(--surface); }
.account-pick .t { font-size: 10.5px; color: var(--text-3); }
.account-pick .v { font-size: 13.5px; font-weight: 600; margin-top: 1px; }
.account-pick .chev { margin-left: auto; }
.arrow-down { text-align: center; color: var(--text-3); font-size: 16px; line-height: .6; }

.entry-display {
  flex: none;
  padding: 6px 18px 8px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.entry-line { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; min-height: 42px; }
.entry-expr {
  font-size: 13px;
  color: var(--text-3);
  padding-bottom: 9px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.entry-amount {
  font-size: clamp(28px, 9vw, 34px);
  font-weight: 750;
  letter-spacing: -1px;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.entry-amount .cur { font-size: 17px; font-weight: 600; opacity: .5; margin-right: 2px; }
.entry-amount .dec { font-size: 19px; opacity: .75; }

.entry-meta {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 6px 14px 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.entry-meta::-webkit-scrollbar { display: none; }
.meta-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 30px;
  padding: 0 10px;
  border-radius: 99px;
  background: var(--surface-2);
  font-size: 11.5px;
  color: var(--text-2);
  white-space: nowrap;
  flex: none;
}
.meta-btn b { font-weight: 600; color: var(--text); }
.meta-btn .x { color: var(--text-3); font-size: 14px; line-height: 1; }
.note-input {
  flex: 1;
  min-width: 100px;
  height: 30px;
  border-radius: 99px;
  background: var(--surface-2);
  border: 0;
  padding: 0 12px;
  font-size: 12px;
}
.note-input::placeholder { color: var(--text-3); }

.keypad {
  flex: none;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border-top: 1px solid var(--line);
  padding-bottom: 14px;
}
.key {
  height: 50px;
  background: var(--surface);
  font-size: 20px;
  font-weight: 500;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
  transition: background .1s;
  user-select: none;
}
.key:active { background: var(--surface-3); }
.key.fn { font-size: 13px; font-weight: 600; color: var(--text-2); }
.key.op { color: var(--text-2); font-size: 22px; }
.key.ok {
  background: var(--primary);
  color: #fff;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: 2px;
}
.key.ok:active { background: var(--primary-dark); }
.key.del { font-size: 19px; }

.entry-delete { padding: 0 18px 8px; background: var(--surface); }
.entry-delete .btn { height: 38px; font-size: 12.5px; }

/* ---------------------------------------------------------------- calendar */

.cal-head {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 10px;
}
.cal-head .m { font-size: 15px; font-weight: 700; }
.cal-head button { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--text-2); }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.cal-dow span { text-align: center; font-size: 10.5px; color: var(--text-3); padding: 4px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-day {
  height: 46px;
  min-width: 0;
  border-radius: 11px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 12.5px;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
  position: relative;
}
.cal-day.empty { pointer-events: none; }
.cal-day .d { font-weight: 550; }
.cal-day .amt { font-size: 8.5px; color: var(--text-3); line-height: 1; }
.cal-day.today .d { color: var(--primary); font-weight: 750; }
.cal-day.sel { background: var(--primary); color: #fff; }
.cal-day.sel .amt { color: rgba(255, 255, 255, .85); }
.cal-day.sel.today .d { color: #fff; }
.cal-day.has { background: var(--primary-soft); }
.cal-day.has.sel { background: var(--primary); }
.cal-day .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--primary); position: absolute; bottom: 4px; }
.cal-day.sel .dot { background: #fff; }
.quick-dates { display: flex; gap: 8px; margin: 12px 0 2px; }
.quick-dates .chip { flex: 1; justify-content: center; height: 34px; }

.day-detail-total {
  display: flex;
  gap: 18px;
  background: var(--surface-2);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--text-2);
}
.day-detail-total b { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- search */

.search-page {
  position: fixed;
  inset: 0;
  z-index: 120;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}
.search-top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(var(--safe-t) + 10px) 12px 8px;
  max-width: 560px;
  width: 100%;
  margin: 0 auto;
}
.search-bar {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  background: var(--surface);
  border-radius: 12px;
  padding: 0 12px;
  box-shadow: var(--shadow-sm);
}
.search-bar svg { width: 17px; height: 17px; color: var(--text-3); flex: none; }
.search-bar input { flex: 1; border: 0; background: none; font-size: 14px; min-width: 0; }
.search-filters { padding: 2px 12px 8px; max-width: 560px; width: 100%; margin: 0 auto; }
.search-body {
  flex: 1;
  overflow-y: auto;
  padding: 2px 14px calc(24px + var(--safe-b));
  max-width: 560px;
  width: 100%;
  margin: 0 auto;
}
.search-summary { font-size: 11.5px; color: var(--text-3); padding: 4px 3px 10px; display: flex; gap: 14px; }
.search-summary b { color: var(--text-2); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- toast / modal / lock */

.toast-root {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--tab-h) + var(--safe-b) + 18px);
  z-index: 300;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
  padding: 0 20px;
}
.toast {
  max-width: 420px;
  padding: 10px 16px;
  border-radius: 12px;
  background: rgba(17, 28, 23, .92);
  color: #fff;
  font-size: 13px;
  line-height: 1.45;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .25);
  text-align: center;
}
[data-theme="dark"] .toast { background: rgba(230, 245, 238, .95); color: #101c16; }
.toast.success { background: rgba(14, 159, 110, .95); }
.toast.error { background: rgba(229, 72, 77, .95); }
@keyframes toastIn {
  from { transform: translateY(10px) scale(.97); }
  to { transform: none; }
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(8, 18, 13, .48);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 26px;
}
.modal {
  width: 100%;
  max-width: 340px;
  background: var(--surface);
  border-radius: 22px;
  padding: 22px 20px 16px;
  box-shadow: var(--shadow-lg);
}
@keyframes modalIn {
  from { transform: scale(.95); }
  to { transform: none; }
}
.modal h3 { margin: 0 0 6px; font-size: 16.5px; }
.modal p { margin: 0 0 18px; font-size: 13px; color: var(--text-2); line-height: 1.65; }
.modal-actions { display: flex; gap: 9px; }
.modal-actions .btn { flex: 1; height: 42px; font-size: 13.5px; }

.lock-screen[hidden] { display: none; }
.lock-screen {
  position: fixed;
  inset: 0;
  z-index: 400;
  background:
    radial-gradient(90% 60% at 50% 0%, rgba(110, 125, 255, .22), transparent 60%),
    var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(78px, calc(var(--safe-t) + 60px)) 38px calc(30px + var(--safe-b));
}
.lock-logo {
  width: 66px;
  height: 66px;
  border-radius: 22px;
  background: var(--fab-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  box-shadow: var(--fab-shadow);
}
.lock-title { margin-top: 16px; font-size: 17px; font-weight: 650; }
.lock-sub { font-size: 12px; color: var(--text-3); margin-top: 5px; }
.pin-dots { display: flex; gap: 14px; margin: 28px 0 8px; }
.pin-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); transition: all .15s; }
.pin-dot.on { background: var(--primary); border-color: var(--primary); transform: scale(1.05); }
.pin-error { font-size: 12px; color: var(--danger); height: 18px; margin-top: 2px; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 74px); gap: 14px; margin-top: auto; }
.pin-key {
  height: 58px;
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  font-size: 23px;
  font-weight: 550;
  display: flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}
.pin-key:active { background: var(--surface-3); }
.pin-key.blank { background: none; box-shadow: none; pointer-events: none; }
.pin-key.del { font-size: 17px; color: var(--text-2); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}
.shake { animation: shake .4s ease; }

/* ---------------------------------------------------------------- misc */

.hint-box {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.65;
}
.color-dots { display: flex; gap: 9px; flex-wrap: wrap; padding: 2px 0; }
.color-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; position: relative; }
.color-dot.active::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--text); }
.icon-picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.icon-picker button { height: 38px; border-radius: 10px; font-size: 19px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
.icon-picker button.active { background: var(--primary-soft); box-shadow: 0 0 0 1.5px var(--primary); }

.footer-space { height: 8px; }

@media (min-width: 600px) {
  .view { padding-left: 20px; padding-right: 20px; }
  .hero { border-radius: 28px; }
}
@media (max-height: 640px) {
  .key { height: 44px; }
  .cat-ico { width: 38px; height: 38px; font-size: 18px; }
  .cat-cell { padding: 5px 0 3px; }
  .entry-amount { font-size: 28px; }
  .entry-display { padding-top: 2px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------------------------------------------------------------- attachments */
.att-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.att-item {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
}
.att-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.att-file { font-size: 28px; opacity: .7; }
.att-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: rgba(10, 20, 16, .62);
  color: #fff;
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.att-name {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 4px 5px;
  font-size: 9px;
  color: #fff;
  background: linear-gradient(transparent, rgba(0, 0, 0, .7));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------------------------------------------------------------- statistics */
.stats-appbar { gap: 6px; }
.stats-tabs {
  display: flex;
  align-items: center;
  gap: 5px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.stats-tabs::-webkit-scrollbar { display: none; }
.stats-tab {
  height: 34px;
  padding: 0 13px;
  border-radius: 10px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-2);
  white-space: nowrap;
  transition: background .18s, color .18s;
}
.stats-tab.active {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 12px -4px rgba(14, 159, 110, .55);
}

.stats-datebar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 2px 0 10px;
  min-height: 40px;
}
.year-btn {
  font-size: 22px;
  font-weight: 750;
  letter-spacing: -.5px;
  color: var(--text);

  padding: 0 1px;

}
.month-rail-wrap { position: relative; flex: 1; min-width: 0; }
.month-rail {
  display: flex;

}

.month-chip {

}
.month-chip.selected {
  color: var(--primary);
  font-weight: 750;
  font-size: 15px;
  background: var(--primary-soft);
}
.rail-arrow {
  position: absolute;
  left: 22px;
  bottom: -2px;
  font-size: 9px;
  color: var(--primary);
  pointer-events: none;
}
.month-bar .chip-back { height: 26px; font-size: 11px; padding: 0 9px; }

.year-bar { justify-content: center; gap: 16px; }
.year-bar .year-label { font-size: 18px; font-weight: 750; letter-spacing: .2px; }
.year-step {
  width: 30px; height: 30px; border-radius: 50%;

  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); font-size: 18px;
}
.year-bar .db-sub { margin-left: 6px; font-size: 11.5px; color: var(--text-3); }

.daily-bar { justify-content: space-between; padding: 4px 2px 0; }
.db-title { font-size: 20px; font-weight: 750; letter-spacing: -.3px; }
.db-sub { font-size: 11.5px; color: var(--text-3); }
.daily-bar .db-sub { font-variant-numeric: tabular-nums; }

.custom-bar { justify-content: center; gap: 10px; }
.date-pill {
  height: 36px; padding: 0 14px; border-radius: 10px;
  background: var(--surface); box-shadow: var(--shadow-sm);
  font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--text);
}
.date-dash { color: var(--text-3); font-size: 12px; }
.preset-row { margin: -4px 0 12px; }

.stats-summary {
  position: relative;
  margin: 2px 0 14px;
  border-radius: 22px;
  padding: 18px 16px 12px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  color: #fff;
  overflow: hidden;
  background: var(--hero-bg);

}
.stats-summary::after {
  content: "";
  position: absolute; right: -50px; top: -70px;

}
.ss-cell { position: relative; z-index: 1; }
.ss-cell span { display: block; font-size: 10.5px; color: rgba(255,255,255,.7); letter-spacing: .5px; }
.ss-cell b {
  display: block; margin-top: 3px;
  font-size: 17px; font-weight: 700; letter-spacing: -.4px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stats-summary .ss-foot {
  grid-column: 1 / -1;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,.13);
  font-size: 10.5px; color: rgba(255,255,255,.66);

}

.stats-chart-card .card-title { align-items: center; }
.stats-mini-seg {
  display: flex;

}
.stats-mini-seg button {
  height: 24px;
  padding: 0 8px;
  border-radius: 6px;
  font-size: 10.5px;
  color: var(--text-2);
  white-space: nowrap;
}
.stats-mini-seg button.active {
  background: var(--surface);
  color: var(--primary);
  font-weight: 700;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.stats-bars { height: 168px; margin-top: 4px; }
.stats-line { height: 140px; margin-top: 4px; }
.chart-note { text-align: right; font-size: 9.5px; color: var(--text-3); margin-top: 2px; }
.sankey-chart { height: 230px; margin-top: 2px; }
.sankey-chart svg { display: block; width: 100%; height: 100%; }

.stats-share-card { padding-bottom: 12px; }
.stats-donut-box { width: 166px; height: 166px; margin: 4px auto 12px; }
.stats-share-legend { display: flex; flex-direction: column; gap: 1px; }
.share-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 2px;
  border-bottom: 1px solid var(--line);

}
.share-row:last-child { border-bottom: 0; }
.share-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-pct { width: 38px; text-align: right; color: var(--text-3); font-size: 10.5px; }
.share-amount { width: 64px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

.rank-bar {
  display: block;
  height: 4px;
  border-radius: 99px;
  background: var(--surface-3);
  margin-top: 4px;
  overflow: hidden;
}
.rank-bar i { display: block; height: 100%; border-radius: 99px; }

.stats-table-card { padding-bottom: 8px; }
.stats-table { margin-top: 2px; }
.st-row {
  display: grid;
  grid-template-columns: 1.15fr 1fr 1fr 1fr;
  gap: 4px;
  align-items: center;
  padding: 9px 2px;
  border-bottom: 1px solid var(--line);

}
.st-row:last-child { border-bottom: 0; }
.st-row span { text-align: right; }
.st-row span:first-child { text-align: left; }
.st-head {
  color: var(--text-3);
  font-size: 10.5px;
  font-weight: 600;
  border-bottom: 1px solid var(--line-strong);
}
.st-date { color: var(--text-2); }
.st-income { color: var(--income); }
.st-expense { color: var(--danger); }
.st-balance { color: var(--text); font-weight: 600; }
.st-negative { color: var(--danger); font-weight: 600; }

.stats-summary-card {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  background: linear-gradient(145deg, var(--surface), var(--surface-2));
}
.summary-leaf {
  width: 34px; height: 34px; border-radius: 11px;
  background: var(--primary-soft);

}

.stats-summary-card p {
  margin: 3px 0;
  font-size: 11.8px;
  color: var(--text-2);
  line-height: 1.65;
}
.stats-summary-card p b { color: var(--text); font-weight: 650; }

.stats-month-picker-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.stats-month-picker-head button {
  width: 34px; height: 34px; border-radius: 50%;

}

.sankey-legend {

  flex-wrap: wrap;

  margin-top: 2px;
  padding-top: 10px;

}
.sankey-legend span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  color: var(--text-2);
}
.sankey-legend i {

/* ---------------------------------------------------------------- calendar */
.calendar-page {
  padding-top: calc(var(--safe-t) + 10px);

}
.calendar-glass {
  position: sticky;
  background: var(--glass-nav);
  top: var(--safe-t);
  z-index: 25;
  border-radius: 22px;
  padding: 6px 14px 6px;
  margin: 0 0 10px;
}
.cal-titlebar { display: flex; align-items: center; gap: 4px; min-height: 34px; }
.cal-arrow {
  width: 28px; height: 28px; border-radius: 50%;
  color: var(--text-2); font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.cal-title {
  font-size: 18px; font-weight: 750; letter-spacing: -.3px;
  color: var(--text); padding: 0 2px;
}
.cal-today {
  height: 24px; padding: 0 9px; margin-left: 4px;
  border-radius: 99px; background: var(--primary-soft);
  color: var(--primary); font-size: 10.5px; font-weight: 650;
}
.icon-btn.accent { color: var(--primary); background: var(--primary-soft); border-radius: 50%; }
.cal-totals {
  display: flex; gap: 16px; margin-top: 8px;
  padding-top: 8px; border-top: 1px solid var(--line);
}
.cal-totals div { display: flex; align-items: baseline; gap: 5px; }
.cal-totals span { font-size: 10px; color: var(--text-3); }
.cal-totals b { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
.cal-totals .in { color: var(--income); }
.cal-totals .out { color: var(--danger); }

.calendar-grid-card {
  touch-action: pan-y;
  background: var(--surface);
  border-radius: 20px;
  box-shadow: var(--shadow-sm);
  padding: 10px 8px 10px;
}
.cal-week {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 4px;
}
.cal-week span {
  text-align: center; font-size: 10.5px; color: var(--text-3);
  padding: 4px 0;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.cal-cell {
  min-height: 62px;
  border-radius: 10px;
  padding: 4px 2px 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 1px;
  color: var(--text);
  background: var(--surface-2);
  overflow: hidden;
}
.cal-cell.empty { background: transparent; pointer-events: none; }
.cal-cell .cc-day {
  font-size: 14px; font-weight: 700; line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.cal-cell.weekend .cc-day { color: var(--danger); }
.cal-cell .cc-lunar {
  font-size: 8px; line-height: 1.3; color: var(--text-3);
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal-cell.festival .cc-lunar { color: var(--danger); font-weight: 600; }
.cal-cell .cc-amounts {
  margin-top: auto; display: flex; flex-direction: column; align-items: center;
  line-height: 1.15; font-size: 8px; font-variant-numeric: tabular-nums;
}
.cal-cell .cc-amounts i { font-style: normal; }
.cal-cell .cc-amounts .out { color: var(--danger); }
.cal-cell .cc-amounts .in { color: var(--income); }
.cal-cell.today { box-shadow: inset 0 0 0 1.5px var(--primary); }
.cal-cell.selected { color: #fff; box-shadow: 0 6px 14px -6px rgba(14,159,110,.65); }
.cal-cell.selected .cc-day,
.cal-cell.selected .cc-lunar,
.cal-cell.selected .cc-amounts i { color: #fff; }
.cal-cell.selected .cc-lunar { opacity: .8; }
.cal-cell.selected .cc-amounts { opacity: .9; }

.calendar-day-panel { margin-top: 14px; }
.cal-day-head {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 3px 8px;
}
.cal-day-head > div:first-child b { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
.cal-day-head > div:first-child span { font-size: 10.5px; color: var(--text-3); margin-left: 5px; }
.cal-day-totals {
  margin-left: auto; display: flex; gap: 8px;
  font-size: 10.5px; color: var(--text-2); font-variant-numeric: tabular-nums;
}
.cal-day-totals span:first-child { color: var(--income); }
.cal-day-totals span:last-child { color: var(--danger); }

/* ---------------------------------------------------------------- selection */
.tx-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  display: flex; align-items: center; justify-content: center;
  flex: none; font-size: 12px; color: #fff;
  background: transparent;
}
.tx.selected { background: var(--primary-soft); }
.tx.selected .tx-check { background: var(--primary); border-color: var(--primary); }
.tx.selected .tx-check::after { content: "✓"; }
.select-bar {
  position: fixed;
  background: var(--glass-nav);
  left: 50%;
  bottom: calc(62px + var(--safe-b) + 22px);
  transform: translateX(-50%);
  width: min(calc(100% - 24px), 520px);
  border-radius: 22px;
  padding: 9px 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  z-index: 70;
}
.select-bar .sel-count { font-size: 12px; font-weight: 650; padding: 0 4px; white-space: nowrap; }
.select-bar .sel-count b { color: var(--primary); font-size: 15px; }
.select-bar .btn { height: 36px; border-radius: 10px; font-size: 12px; padding: 0 11px; }
.select-bar .btn.primary { flex: 1; }
.select-bar .sel-close { color: var(--text-2); font-size: 12px; padding: 0 4px; }

/* ---------------------------------------------------------------- pull to add */
.pull-hint {
  position: fixed;
  top: calc(var(--safe-t) + 8px);
  left: 50%;
  transform: translate(-50%, -64px);
  z-index: 90;
  min-width: 132px;
  padding: 9px 16px;
  border-radius: 99px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  transition: transform .18s ease, opacity .18s;
  opacity: 0;
  pointer-events: none;
}
.pull-hint.show { transform: translate(-50%, 0); opacity: 1; }
.pull-hint.ready { color: #fff; background: var(--primary); }
.pull-hint .arrow { font-size: 15px; line-height: 1; }

.tx-time { font-variant-numeric: tabular-nums; color: var(--text-3); }
.month-stepper { display: flex; gap: 2px; flex: none; }
.month-stepper button {
  width: 24px;
  height: 30px;
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  color: var(--text-2);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tabbar::before {
  content: "";
  position: absolute;
  left: -14px;
  right: -14px;
  bottom: -12px;
  height: calc(100% + 24px);
  border-radius: 34px;
  background: linear-gradient(to top, var(--bg) 0%, var(--bg) 52%, transparent 100%);
  z-index: -1;
  pointer-events: none;
}

/* 隐藏所有滚动条与侧边提示 */
* { scrollbar-width: none; -ms-overflow-style: none; }
*::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
html, body { overscroll-behavior: none; }
body[data-route="calendar"], body[data-route="profile"] { overscroll-behavior: none; }
body[data-route="calendar"] #view, body[data-route="profile"] #view { overscroll-behavior: contain; }

.acct-balance { cursor: pointer; }

/* 五页左右切换动画 */
#view.page-next { animation: pageNext .22s cubic-bezier(.2,.8,.25,1); }
#view.page-prev { animation: pagePrev .22s cubic-bezier(.2,.8,.25,1); }
@keyframes pageNext {
  from { opacity: .65; transform: translateX(26px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes pagePrev {
  from { opacity: .65; transform: translateX(-26px); }
  to { opacity: 1; transform: translateX(0); }
}
body[data-route="profile"] .profile { padding-top: calc(var(--safe-t) + 14px); }
.month-rail.swipe-next { animation: monthSwipeNext .22s ease; }
.month-rail.swipe-prev { animation: monthSwipePrev .22s ease; }
@keyframes monthSwipeNext {
  from { opacity: .35; transform: translateX(-16px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes monthSwipePrev {
  from { opacity: .35; transform: translateX(16px); }
  to { opacity: 1; transform: translateX(0); }
}

  --hero-bg: radial-gradient(80% 80% at 100% 0%, rgba(74,163,255,.3), transparent 55%), radial-gradient(70% 60% at 0% 100%, rgba(2,20,40,.75), transparent 60%), radial-gradient(2px 2px at 28% 68%, rgba(180,230,255,.35), transparent 100%), linear-gradient(135deg,#0a2b4a,#03121f 55%,#0e3c5e);

.sw-auto { background: linear-gradient(135deg,#5b6cff,#0a0f2a 55%,#8b9cff); }

.sw-dark { background: linear-gradient(135deg,#111a40,#060916 55%,#17112f); }

.sw-sky { background: linear-gradient(135deg,#1c4e9c,#2f80ed 55%,#bfe3ff); }

.sw-castle { background: linear-gradient(135deg,#8e2b63,#b34a82 55%,#ffc8e6); }
.sw-wheat { background: linear-gradient(135deg,#8a5a18,#c08a2e 55%,#ffe29a); }
.sw-snow { background: linear-gradient(135deg,#5f7fa8,#7aa6d6 55%,#eaf6ff); }

.sw-wave { background: linear-gradient(135deg,#0c5b73,#1386a1 55%,#a8eef5); }

/* 我的品牌头 */
.profile-brand {

}

}
.profile-brand > * { position: relative; z-index: 1; }
.profile-brand-logo {
  width: 52px; height: 52px; border-radius: 15px; flex: none;

}
.profile-brand-name { font-size: 19px; font-weight: 750; letter-spacing: -.3px; }
.profile-brand-sub { font-size: 11px; opacity: .72; margin-top: 2px; }
.profile-brand-badge { margin-left: auto; font-size: 9px; padding: 3px 7px; border-radius: 99px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.18); }
.empty-emoji.theme-symbol { color: var(--primary); font-size: 34px; text-shadow: 0 4px 16px rgba(0,0,0,.08); }

.bookkeeping-bar {

}

.bookkeeping-bar .chev { color: var(--text-3); }

/* 液态玻璃：更低不透明度 + 更强模糊，能透出下一层界面 */
.appbar, .tabbar, .calendar-glass, .select-bar, .liquid {
  background: color-mix(in srgb, var(--surface) 58%, transparent) !important;
  backdrop-filter: blur(30px) saturate(1.9);
  -webkit-backdrop-filter: blur(30px) saturate(1.9);
  border: 1px solid color-mix(in srgb, #ffffff 46%, transparent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.5), var(--glass-shadow);
}
.appbar { border-left: 0; border-right: 0; border-top: 0; border-radius: 0; }
[data-theme="storm"] .appbar, [data-theme="storm"] .tabbar, [data-theme="storm"] .calendar-glass, [data-theme="storm"] .select-bar, [data-theme="storm"] .liquid,
[data-theme="ocean"] .appbar, [data-theme="ocean"] .tabbar, [data-theme="ocean"] .calendar-glass, [data-theme="ocean"] .select-bar, [data-theme="ocean"] .liquid {
  background: color-mix(in srgb, #10182a 58%, transparent) !important;

}
@supports not (background: color-mix(in srgb, #fff 50%, transparent)) {
  .appbar, .tabbar, .calendar-glass, .select-bar, .liquid { background: var(--surface) !important; }
}

/* 年统计 / 图表交互 */
.year-rail-bar { gap: 8px; }
.year-all {
  flex: none; height: 32px; padding: 0 12px; border-radius: 10px;
  background: var(--surface); box-shadow: var(--shadow-sm);
  color: var(--text-2); font-size: 12px; font-weight: 650;
}
.year-all.active { background: var(--primary); color: #fff; }
.year-chip { width: 68px; }
.stats-chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.stats-chart-head .card-title { flex: none; }
.stats-chart-controls { display: flex; align-items: center; gap: 5px; margin-left: auto; }
.stats-chart-controls .stats-mini-seg button { padding: 0 6px; }
.stats-chart-type { display: flex; background: var(--surface-3); border-radius: 8px; padding: 2px; gap: 1px; }
.stats-chart-type button { width: 26px; height: 24px; border-radius: 6px; color: var(--text-3); font-size: 13px; }
.stats-chart-type button.active { background: var(--surface); color: var(--primary); font-weight: 700; }
.stats-data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 10px; }
.stats-data-grid > div { background: var(--surface-2); border-radius: 12px; padding: 10px 8px; text-align: center; }
.stats-data-grid span { display: block; font-size: 9.5px; color: var(--text-3); }
.stats-data-grid b { display: block; margin-top: 3px; font-size: 14px; font-variant-numeric: tabular-nums; }
.chart-tip {
  position: absolute; z-index: 5; top: 3px; transform: translateX(-50%);
  background: rgba(18, 28, 45, .92); color: #fff; border-radius: 9px;
  padding: 6px 9px; font-size: 10px; line-height: 1.55; pointer-events: none;
  opacity: 0; transition: opacity .15s; white-space: nowrap;
  box-shadow: 0 8px 22px rgba(0,0,0,.24);
}
.chart-tip.show { opacity: 1; }
.chart-tip .tip-label { color: rgba(255,255,255,.6); font-size: 9px; margin-bottom: 1px; }
.chart-tip .tip-row { display: flex; align-items: center; gap: 4px; }
.chart-tip b { margin-left: auto; font-weight: 650; }
.chart-tip .tip-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.chart-tip .tip-row + .tip-row { margin-top: 1px; }

/* 年度汇总展开 */
.ss-toggle {
  position: absolute; right: 14px; bottom: 9px;
  color: rgba(255,255,255,.82); font-size: 10px; z-index: 2;
  display: flex; align-items: center; gap: 3px;
}
.ss-toggle span { font-size: 12px; }
.stats-summary .ss-extra {
  grid-column: 1 / -1;
  display: none;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px 8px;
  margin-top: 8px; padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,.14);
  position: relative; z-index: 1;
}
.stats-summary .ss-extra.open { display: grid; }
.ss-metric span { display: block; font-size: 9.5px; color: rgba(255,255,255,.6); }
.ss-metric b { display: block; font-size: 12.5px; font-weight: 650; margin-top: 1px; font-variant-numeric: tabular-nums; }
.stats-summary.open .ss-foot { padding-bottom: 2px; }

/* 年度热力图 */
.heat-year-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: max-content; align-content: start; align-items: start; gap: 10px 8px; margin: 6px 0 10px; }
.heat-month { min-width: 0; overflow: hidden; align-self: start; }
.heat-month-label { font-size: 10px; color: var(--text-3); margin-bottom: 4px; }
.heat-mini { display: grid; grid-template-columns: repeat(7, 7px); grid-auto-rows: 7px; gap: 2px; min-width: 0; justify-content: center; justify-items: center; }
.heat-dot { width: 7px; height: 7px; min-width: 0; border-radius: 50%; background: var(--surface-3); display: block; justify-self: center; }
.heat-dot.empty { background: transparent; }
.heat-expand { width: 100%; height: 30px; border-radius: 9px; background: var(--surface-2); color: var(--text-3); font-size: 10.5px; }
.heat-expand span { color: var(--primary); margin-left: 3px; }
.heatmap-sheet { max-height: 94dvh; }
.heat-full { display: flex; flex-direction: column; gap: 20px; padding-bottom: 10px; }
.heat-full-month h4 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
.heat-full-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 3px; }
.heat-full-week span { text-align: center; font-size: 9px; color: var(--text-3); }
.heat-full-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.heat-full-cell {
  aspect-ratio: 1; min-height: 0; border-radius: 8px; background: var(--surface-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; font-variant-numeric: tabular-nums; overflow: hidden;
}
.heat-full-cell.empty { background: transparent; }
.heat-full-cell b { font-size: 11px; font-weight: 600; }
.heat-full-cell i { font-style: normal; font-size: 8px; color: var(--text-2); }
@media (max-width: 360px) {
  .stats-chart-controls { width: 100%; justify-content: flex-end; }
  .heat-year-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px 7px; }
  .heat-mini { grid-template-columns: repeat(7, 6px); grid-auto-rows: 6px; }
  .heat-dot { width: 6px; height: 6px; }
}

.bill-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 12px; }
.bill-summary > div { background: var(--surface-2); border-radius: 12px; padding: 10px 8px; text-align: center; }
.bill-summary span { display: block; font-size: 9.5px; color: var(--text-3); }
.bill-summary b { display: block; margin-top: 3px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.bill-sheet .tx-list { margin: 0 -2px; }

/* 日历月份滑动轨道 */
.calendar-grid-card { overflow: hidden; position: relative; }
.calendar-track {
  display: flex;
  width: 300%;
  transform: translate3d(-33.3333%, 0, 0);
  will-change: transform;
}
.cal-slide { flex: 0 0 33.3333%; min-width: 0; }
.cal-slide.side { pointer-events: none; }
.cal-slide-month {
  text-align: center;
  font-size: 10px;
  color: var(--text-3);
  font-weight: 600;
  margin: 0 0 2px;
}

/* 统计模式四页滑动 */
.stats-carousel { overflow: hidden; position: relative; }
.stats-track {
  display: flex;
  width: 400%;
  align-items: flex-start;
  will-change: transform;
}
.stats-pane {
  flex: 0 0 25%;
  min-width: 0;
  align-self: flex-start;
}
.stats-pane > .stats { min-width: 0; }

/* 五页整页左右滑动过渡：旧页滑出、新页滑入 */
html, body { overflow-x: hidden; }
.page-ghost {
  position: fixed;
  left: 0;
  right: 0;
  overflow: hidden;
  z-index: 20;
  pointer-events: none;
  background: var(--bg);
  will-change: transform;
}
.page-ghost > .view {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
}
.page-ghost.to-left { animation: ghostSlideLeft .3s cubic-bezier(.22,.8,.28,1) both; }
.page-ghost.to-right { animation: ghostSlideRight .3s cubic-bezier(.22,.8,.28,1) both; }
@keyframes ghostSlideLeft { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@keyframes ghostSlideRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
#view.page-slide-next { animation: pageSlideNext .3s cubic-bezier(.22,.8,.28,1); }
#view.page-slide-prev { animation: pageSlidePrev .3s cubic-bezier(.22,.8,.28,1); }
@keyframes pageSlideNext { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes pageSlidePrev { from { transform: translateX(-100%); } to { transform: translateX(0); } }

  const SOLAR_FESTIVALS = {
    '01-01': '元旦', '02-14': '情人节', '03-08': '妇女节', '03-12': '植树节',
    '04-01': '愚人节', '05-01': '劳动节', '05-04': '青年节', '06-01': '儿童节',
    '07-01': '建党节', '08-01': '建军节', '09-10': '教师节', '10-01': '国庆节',
    '10-31': '万圣节', '12-24': '平安夜', '12-25': '圣诞节'
  };
  const LUNAR_FESTIVALS = {
    '正月初一': '春节', '正月十五': '元宵节', '二月初二': '龙抬头',
    '五月初五': '端午节', '七月初七': '七夕节', '八月十五': '中秋节',
    '九月初九': '重阳节', '腊月初八': '腊八节', '腊月廿三': '小年'
  };

  function chineseLunarDay(n) {
    const digits = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
    if (n <= 10) return '初' + digits[n];
    if (n < 20) return '十' + digits[n - 10];
    if (n === 20) return '二十';
    if (n < 30) return '廿' + digits[n - 20];
    return '三十';
  }

  function solarTermName(iso) {
    const d = parseISO(iso);
    const year = d.getFullYear();
    const month = d.getMonth() + 1;
    const day = d.getDate();
    for (let i = (month - 1) * 2; i <= (month - 1) * 2 + 1; i++) {
      const ms = 31556925974.7 * (year - 1900) + SOLAR_TERM_INFO[i] * 60000 + Date.UTC(1900, 0, 6, 2, 5);
      const term = new Date(ms);
      if (term.getUTCMonth() + 1 === month && term.getUTCDate() === day) return SOLAR_TERM_NAMES[i];
    }
    return '';
  }

  /** 日历单元格的农历 / 节日 / 节气文字。 */
  function calendarLabel(iso) {
    const d = parseISO(iso);
    const solarKey = pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
    const solarFestival = SOLAR_FESTIVALS[solarKey] || '';
    let lunar = null;
    try {
      const parts = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
        month: 'long', day: 'numeric'
      }).formatToParts(d);
      const monthName = (parts.find((p) => p.type === 'month') || {}).value || '';
      const dayNum = Number((parts.find((p) => p.type === 'day') || {}).value || 0);
      if (monthName && dayNum) {
        lunar = {
          monthName,
          dayNum,
          dayName: chineseLunarDay(dayNum),
          key: monthName + (dayNum === 1 ? '初一' : chineseLunarDay(dayNum))
        };
      }
    } catch (err) { /* 浏览器不支持中国农历时降级 */ }

    const lunarKey = lunar ? lunar.monthName + lunar.dayName : '';
    const lunarFest = lunar ? (LUNAR_FESTIVALS[lunarKey] || '') : '';
    const term = solarTermName(iso);
    const festival = solarFestival || lunarFest;
    const text = festival || term || (lunar ? (lunar.dayNum === 1 ? lunar.monthName : lunar.dayName) : '');
    return {
      text,
      festival,
      term,
      lunar: lunar ? (lunar.dayNum === 1 ? lunar.monthName : lunar.dayName) : '',
      lunarMonth: lunar ? lunar.monthName : '',
      lunarDay: lunar ? lunar.dayNum : 0,
      holiday: !!festival
    };
  }

  function monthDays(key) {
    const [y, m] = key.split('-').map(Number);
    const n = daysInMonth(y, m);
    const out = [];
    for (let i = 1; i <= n; i++) out.push(key + '-' + pad2(i));
    return out;
  }
  function monthsBetween(startKey, endKey) {
    const [sy, sm] = startKey.split('-').map(Number);
    const [ey, em] = endKey.split('-').map(Number);
    return (ey - sy) * 12 + (em - sm);
  }

  // 金额一律以「分」参与加减，避免 0.1+0.2 浮点误差
  function toCents(n) { return Math.round((Number(n) || 0) * 100); }
  function fromCents(c) { return Math.round(c) / 100; }
  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function money(n, digits) {
    const d = digits == null ? 2 : digits;
    const v = Number(n) || 0;
    const fixed = Math.abs(v).toFixed(d);
    const parts = fixed.split('.');
    const int = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (v < 0 ? '-' : '') + int + (d > 0 ? '.' + (parts[1] || '') : '');
  }
  function amountParts(n) {
    const abs = Math.abs(round2(n));
    const fixed = abs.toFixed(2);
    const [int, dec] = fixed.split('.');
    return {
      sign: (Number(n) || 0) < 0 ? '-' : '',
      int: int.replace(/\B(?=(\d{3})+(?!\d))/g, ','),
      dec: dec
    };
  }

  /** 解析 12+3.5-1 这类算式，失败返回 NaN */
  function parseAmountExpr(expr) {
    if (typeof expr === 'number') return isFinite(expr) ? round2(expr) : NaN;
    const s = String(expr == null ? '' : expr).replace(/[\s,，]/g, '');
    if (!s) return NaN;
    if (!/^[+-]?(\d+(\.\d*)?|\.\d+)([+-](\d+(\.\d*)?|\.\d+))*$/.test(s)) return NaN;
    const tokens = s.match(/[+-]?(\d+(?:\.\d*)?|\.\d+)/g) || [];
    let cents = 0;
    for (const tok of tokens) {
      if (tok === '+' || tok === '-') continue;
      const v = Number(tok);
      if (!isFinite(v)) return NaN;
      cents += Math.round(v * 100);
    }
    return fromCents(cents);
  }

    const subMap = {

    let created = 0;
    for (let back = 2; back >= 0; back--) {
      const y = now.getFullYear();

      const first = new Date(y, m, 1, 12);
      const yy = first.getFullYear();
      const mm = first.getMonth();
      const dim = daysInMonth(yy, mm + 1);
      const today = now.getDate();
      const maxDay = back === 0 ? today : dim;
      const key = yy + '-' + pad2(mm + 1);

      // 固定的大额支出 / 收入
      const fixed = [
        { day: 5, type: 'expense', cat: 'c_home', note: '房租', amount: 1800, account: 'a_bank', tags: ['固定支出'] },

  /** 让演示数据的账户余额保持自然（不至于一打开就是负数） */
  function adjustDemoBalances(data) {
    const flow = {};
    data.accounts.forEach((a) => {
      flow[a.id] = 0; });
    data.transactions.forEach((t) => {
      if (t.type === 'income' && flow[t.accountId] != null) flow[t.accountId] += t.amount;
      if (t.type === 'expense' && flow[t.accountId] != null) flow[t.accountId] -= t.amount;
      if (t.type === 'transfer') {
        if (flow[t.accountId] != null) flow[t.accountId] -= t.amount;
        if (t.toAccountId && flow[t.toAccountId] != null) flow[t.toAccountId] += t.amount;
      }
    });
    const targets = { cash: 800, alipay: 3200, wechat: 2200, bank: 22000, credit: 0, invest: 5000, other: 500 };
    data.accounts.forEach((a) => {
      const target = targets[a.type] == null ? 500 : targets[a.type];
      const needed = round2(target - (flow[a.id] || 0));
      if (needed > a.initial) a.initial = Math.ceil(needed / 100) * 100;
    });
  }

    });
    if (!data.books.some((b) => b.id === data.activeBookId)) data.activeBookId = data.books[0].id;
